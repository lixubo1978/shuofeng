<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>代理商登录｜硕丰科技</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Microsoft YaHei",
        Arial,
        sans-serif;

      background: #f4f6f8;

      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-container {
      width: 100%;
      max-width: 420px;

      background: #ffffff;

      padding: 42px 36px;

      border-radius: 14px;

      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.08);
    }

    .logo {
      text-align: center;
      margin-bottom: 10px;
    }

    .logo-title {
      font-size: 26px;
      font-weight: 700;
      color: #0b1220;
    }

    .logo-subtitle {
      margin-top: 6px;
      font-size: 14px;
      color: #777;
    }

    h2 {
      text-align: center;

      margin-top: 30px;
      margin-bottom: 30px;

      font-size: 21px;

      color: #222;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;

      margin-bottom: 8px;

      font-size: 14px;
      font-weight: 600;

      color: #333;
    }

    input {
      width: 100%;

      padding: 13px 14px;

      border: 1px solid #d8dde3;
      border-radius: 8px;

      font-size: 15px;

      outline: none;

      transition: 0.2s;
    }

    input:focus {
      border-color: #1f6feb;

      box-shadow:
        0 0 0 3px rgba(31, 111, 235, 0.10);
    }

    .password-wrapper {
      position: relative;
    }

    .password-wrapper input {
      padding-right: 65px;
    }

    .show-password {
      position: absolute;

      right: 12px;
      top: 50%;

      transform: translateY(-50%);

      border: none;
      background: none;

      cursor: pointer;

      color: #555;

      font-size: 13px;
    }

    .login-btn {
      width: 100%;

      margin-top: 8px;

      padding: 14px;

      border: none;
      border-radius: 8px;

      background: #0b1220;
      color: white;

      font-size: 16px;
      font-weight: 600;

      cursor: pointer;

      transition: 0.2s;
    }

    .login-btn:hover {
      background: #1d2a3d;
    }

    .login-btn:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .back-btn {
      display: block;
      width: 100%;

      margin-top: 12px;

      padding: 13px;

      border: 1px solid #d8dde3;
      border-radius: 8px;

      background: #ffffff;
      color: #333;

      font-size: 15px;
      font-weight: 600;

      text-align: center;
      text-decoration: none;

      cursor: pointer;

      transition: 0.2s;
    }

    .back-btn:hover {
      background: #f4f6f8;
      border-color: #bfc6ce;
    }

    .message {
      margin-top: 18px;

      text-align: center;

      font-size: 14px;

      min-height: 20px;

      line-height: 1.6;
    }

    .error {
      color: #d93025;
    }

    .success {
      color: #188038;
    }

    .security-note {
      margin-top: 20px;

      padding: 12px;

      background: #f7f8fa;

      border-radius: 8px;

      color: #666;

      font-size: 12px;

      line-height: 1.6;
    }

    .footer {
      margin-top: 28px;

      text-align: center;

      font-size: 12px;

      color: #999;
    }
  </style>
</head>


<body>


<div class="login-container">


  <div class="logo">

    <div class="logo-title">
      硕丰科技
    </div>

    <div class="logo-subtitle">
      企业管理系统
    </div>

  </div>


  <h2>
    代理商登录
  </h2>


  <form id="loginForm">


    <div class="form-group">

      <label for="username">
        登录邮箱
      </label>

      <input
        type="email"
        id="username"
        name="username"
        placeholder="请输入代理商登录邮箱"
        autocomplete="username"
        required
      >

    </div>


    <div class="form-group">

      <label for="password">
        密码
      </label>


      <div class="password-wrapper">

        <input
          type="password"
          id="password"
          name="password"
          placeholder="请输入密码"
          autocomplete="current-password"
          required
        >


        <button
          type="button"
          class="show-password"
          onclick="togglePassword()"
        >
          显示
        </button>

      </div>

    </div>


    <button
      type="submit"
      class="login-btn"
      id="loginBtn"
    >
      登录代理商系统
    </button>


    <a
      href="index.html"
      class="back-btn"
    >
      返回首页
    </a>


    <div
      id="message"
      class="message"
    ></div>


  </form>


  <div class="security-note">
    本页面仅供硕丰科技授权代理商使用。
    代理商账号由公司统一创建并分配权限，
    已停用或未经授权的账号无法进入代理商系统。
  </div>


  <div class="footer">
    © 2026 硕丰科技
  </div>


</div>


<script>

  /* =====================================================
     Supabase
  ===================================================== */

  const SUPABASE_URL =
    "https://icmifhjjhgjrhkunjbmu.supabase.co";


  const SUPABASE_KEY =
    "sb_publishable_PR-D5FTznDtffymRmANXqQ_a5qYXrI4";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  const loginForm =
    document.getElementById(
      "loginForm"
    );


  const loginBtn =
    document.getElementById(
      "loginBtn"
    );


  const message =
    document.getElementById(
      "message"
    );


  /* =====================================================
     页面打开时
     如果之前已经登录，则检查是否为有效代理商
  ===================================================== */

  document.addEventListener(
    "DOMContentLoaded",

    async function() {

      try {

        const {
          data
        } =
          await supabaseClient
            .auth
            .getSession();


        if (
          data
          &&
          data.session
          &&
          data.session.user
        ) {

          const allowed =
            await verifyAgentAccess(
              data.session.user
            );


          if (
            allowed
          ) {

            window.location.replace(
              "agentplatform.html"
            );

          }

          else {

            await supabaseClient
              .auth
              .signOut();

          }

        }

      }

      catch (error) {

        console.error(
          "检查现有登录状态失败：",
          error
        );

      }

    }

  );


  /* =====================================================
     登录
  ===================================================== */

  loginForm.addEventListener(
    "submit",

    async function(event) {

      event.preventDefault();


      const email =
        document
          .getElementById(
            "username"
          )
          .value
          .trim()
          .toLowerCase();


      const password =
        document
          .getElementById(
            "password"
          )
          .value;


      if (
        !email
        ||
        !password
      ) {

        showMessage(
          "请输入登录邮箱和密码。",
          "error"
        );

        return;

      }


      loginBtn.disabled =
        true;


      loginBtn.innerText =
        "正在登录...";


      showMessage(
        "",
        ""
      );


      try {

        /* =========================================
           第一步
           Supabase Authentication 验证
        ========================================= */

        const {
          data: loginData,
          error: loginError
        } =
          await supabaseClient
            .auth
            .signInWithPassword({

              email:
                email,

              password:
                password

            });


        if (
          loginError
          ||
          !loginData
          ||
          !loginData.user
        ) {

          throw new Error(
            "代理商邮箱或密码错误。"
          );

        }


        const user =
          loginData.user;


        /* =========================================
           第二步
           检查是不是有效代理商
        ========================================= */

        const allowed =
          await verifyAgentAccess(
            user
          );


        if (
          !allowed
        ) {

          await supabaseClient
            .auth
            .signOut();


          return;

        }


        /* =========================================
           登录成功
        ========================================= */

        showMessage(
          "登录成功，正在进入代理商系统……",
          "success"
        );


        setTimeout(

          function() {

            window.location.replace(
              "agentplatform.html"
            );

          },

          400

        );


      }

      catch (error) {

        console.error(
          "代理商登录失败：",
          error
        );


        await supabaseClient
          .auth
          .signOut();


        showMessage(
          error.message
          ||
          "登录失败，请稍后重试。",
          "error"
        );

      }

      finally {

        loginBtn.disabled =
          false;


        loginBtn.innerText =
          "登录代理商系统";

      }

    }

  );


  /* =====================================================
     验证代理商权限
  ===================================================== */

  async function verifyAgentAccess(
    user
  ) {

    try {

      if (
        !user
        ||
        !user.id
      ) {

        showMessage(
          "登录状态无效。",
          "error"
        );

        return false;

      }


      /* =========================================
         检查 profiles
      ========================================= */

      const {
        data: profile,
        error: profileError
      } =
        await supabaseClient
          .from("profiles")
          .select(
            "id, display_name, role, is_active"
          )
          .eq(
            "id",
            user.id
          )
          .maybeSingle();


      if (
        profileError
      ) {

        console.error(
          "读取代理商权限资料失败：",
          profileError
        );


        showMessage(
          "无法读取代理商权限资料。",
          "error"
        );

        return false;

      }


      if (
        !profile
      ) {

        showMessage(
          "该账号尚未配置代理商权限。",
          "error"
        );

        return false;

      }


      if (
        profile.role !==
        "agent"
      ) {

        showMessage(
          "该账号不是代理商账号。",
          "error"
        );

        return false;

      }


      if (
        profile.is_active !==
        true
      ) {

        showMessage(
          "该代理商账号已被停用，请联系硕丰科技。",
          "error"
        );

        return false;

      }


      /* =========================================
         检查 agents
      ========================================= */

      const {
        data: agent,
        error: agentError
      } =
        await supabaseClient
          .from("agents")
          .select(
            `
              id,
              agent_code,
              agent_name,
              auth_user_id,
              is_active
            `
          )
          .eq(
            "auth_user_id",
            user.id
          )
          .maybeSingle();


      if (
        agentError
      ) {

        console.error(
          "读取代理商资料失败：",
          agentError
        );


        showMessage(
          "无法读取代理商资料。",
          "error"
        );

        return false;

      }


      if (
        !agent
      ) {

        showMessage(
          "该登录账号尚未绑定代理商资料。",
          "error"
        );

        return false;

      }


      if (
        agent.auth_user_id !==
        user.id
      ) {

        showMessage(
          "代理商账号绑定信息不正确。",
          "error"
        );

        return false;

      }


      if (
        agent.is_active !==
        true
      ) {

        showMessage(
          "该代理商已被设为无效，请联系硕丰科技。",
          "error"
        );

        return false;

      }


      /* =========================================
         保存少量页面使用信息

         注意：
         真正权限仍然以 Supabase 数据库为准
      ========================================= */

      sessionStorage.setItem(
        "agentId",
        String(agent.id)
      );


      sessionStorage.setItem(
        "agentCode",
        agent.agent_code || ""
      );


      sessionStorage.setItem(
        "agentName",
        agent.agent_name || ""
      );


      sessionStorage.setItem(
        "agentUserId",
        user.id
      );


      return true;

    }

    catch (error) {

      console.error(
        "验证代理商权限失败：",
        error
      );


      showMessage(
        "代理商权限验证失败，请稍后重试。",
        "error"
      );


      return false;

    }

  }


  /* =====================================================
     显示 / 隐藏密码
  ===================================================== */

  function togglePassword() {


    const passwordInput =
      document.getElementById(
        "password"
      );


    const button =
      document.querySelector(
        ".show-password"
      );


    if (
      passwordInput.type ===
      "password"
    ) {


      passwordInput.type =
        "text";


      button.innerText =
        "隐藏";


    }

    else {


      passwordInput.type =
        "password";


      button.innerText =
        "显示";


    }

  }


  /* =====================================================
     消息提示
  ===================================================== */

  function showMessage(
    text,
    type
  ) {


    message.innerText =
      text;


    message.className =
      "message"
      +
      (
        type
          ?
          " " + type
          :
          ""
      );

  }

</script>


</body>
</html>
