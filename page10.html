<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    http-equiv="Cache-Control"
    content="no-store, no-cache, must-revalidate, max-age=0"
  >

  <meta
    http-equiv="Pragma"
    content="no-cache"
  >

  <meta
    http-equiv="Expires"
    content="0"
  >

  <title>管理人员登录｜硕丰科技</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;
      padding: 0;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Microsoft YaHei",
        Arial,
        sans-serif;

      background: #f4f6f8;

      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

    }


    .login-container {

      width: 100%;
      max-width: 420px;

      background: #ffffff;

      padding: 42px 36px;

      border-radius: 14px;

      box-shadow:
        0 10px 30px
        rgba(0, 0, 0, 0.08);

    }


    .logo {

      text-align: center;

      margin-bottom: 10px;

    }


    .logo-title {

      font-size: 25px;

      font-weight: 700;

      color: #111827;

      letter-spacing: 1px;

    }


    .logo-subtitle {

      margin-top: 5px;

      font-size: 13px;

      color: #6b7280;

    }


    .login-title {

      margin-top: 30px;

      margin-bottom: 26px;

      text-align: center;

      font-size: 20px;

      font-weight: 600;

      color: #1f2937;

    }


    .form-group {

      margin-bottom: 20px;

    }


    label {

      display: block;

      margin-bottom: 8px;

      font-size: 14px;

      font-weight: 600;

      color: #374151;

    }


    input {

      width: 100%;

      padding: 12px 13px;

      border:
        1px solid #d1d5db;

      border-radius: 8px;

      font-size: 15px;

      outline: none;

      background: #ffffff;

      transition:
        border-color 0.2s,
        box-shadow 0.2s;

    }


    input:focus {

      border-color: #2563eb;

      box-shadow:
        0 0 0 3px
        rgba(37, 99, 235, 0.10);

    }


    .login-button {

      width: 100%;

      margin-top: 8px;

      padding: 13px;

      border: none;

      border-radius: 8px;

      background: #0f172a;

      color: #ffffff;

      font-size: 15px;

      font-weight: 600;

      cursor: pointer;

      transition: 0.2s;

    }


    .login-button:hover {

      background: #1e293b;

    }


    .login-button:disabled {

      opacity: 0.6;

      cursor: not-allowed;

    }


    .message {

      min-height: 20px;

      margin-top: 16px;

      text-align: center;

      font-size: 13px;

      font-weight: 500;

      line-height: 1.5;

    }


    .message.error {

      color: #dc2626;

    }


    .message.success {

      color: #059669;

    }


    .security-note {

      margin-top: 26px;

      padding-top: 18px;

      border-top:
        1px solid #e5e7eb;

      text-align: center;

      font-size: 12px;

      color: #9ca3af;

      line-height: 1.7;

    }


    @media (max-width: 520px) {

      body {

        padding: 18px;

      }


      .login-container {

        padding:
          34px 24px;

      }

    }

  </style>

</head>



<body>


  <div class="login-container">


    <div class="logo">

      <div class="logo-title">

        硕丰科技

      </div>


      <div class="logo-subtitle">

        ShuoFeng Technology

      </div>

    </div>



    <div class="login-title">

      管理人员登录

    </div>



    <form
      id="loginForm"
      autocomplete="off"
    >


      <!--
        假输入框

        用来降低浏览器自动填充
        历史用户名密码的概率
      -->

      <input
        type="text"
        autocomplete="username"
        tabindex="-1"
        aria-hidden="true"

        style="
          position:absolute;
          left:-10000px;
          top:-10000px;
          width:1px;
          height:1px;
          opacity:0;
        "
      >


      <input
        type="password"
        autocomplete="current-password"
        tabindex="-1"
        aria-hidden="true"

        style="
          position:absolute;
          left:-10000px;
          top:-10000px;
          width:1px;
          height:1px;
          opacity:0;
        "
      >



      <!-- 用户名 -->

      <div class="form-group">


        <label for="username">

          用户名

        </label>


        <input
          id="username"

          name="management_login_username"

          type="text"

          autocomplete="off"

          autocorrect="off"

          autocapitalize="none"

          spellcheck="false"

          readonly

          required
        >


      </div>



      <!-- 密码 -->

      <div class="form-group">


        <label for="password">

          密码

        </label>


        <input
          id="password"

          name="management_login_password"

          type="password"

          autocomplete="new-password"

          readonly

          required
        >


      </div>



      <button
        id="loginButton"

        class="login-button"

        type="submit"
      >

        登录

      </button>



      <div
        id="message"
        class="message"
      ></div>


    </form>



    <div class="security-note">

      为保护管理系统安全，本页面不保存登录用户名和密码。
      <br>
      每次进入管理系统均需重新手动输入。

    </div>


  </div>




  <script>

    /* ====================================================

       硕丰科技
       管理人员登录页面

       page10.html

    ==================================================== */


    const LOGIN_API =
      "/api/management/login";


    const MANAGEMENT_PAGE =
      "wholemanagement.html";



    const usernameInput =
      document.getElementById(
        "username"
      );


    const passwordInput =
      document.getElementById(
        "password"
      );


    const loginForm =
      document.getElementById(
        "loginForm"
      );


    const loginButton =
      document.getElementById(
        "loginButton"
      );


    const message =
      document.getElementById(
        "message"
      );



    /* ====================================================
       清除以前前端保存的登录资料
    ==================================================== */

    function clearOldLoginData() {


      /*
        这里只删除以前可能保存过的
        管理系统前端数据。

        不删除服务器的 HttpOnly Session Cookie。
      */


      const keys = [

        "managementLogin",

        "managementUser",

        "managementRole",

        "loginTime",

        "username",

        "password"

      ];


      keys.forEach(function(key) {


        try {

          localStorage.removeItem(
            key
          );

        }

        catch (error) {

        }


        try {

          sessionStorage.removeItem(
            key
          );

        }

        catch (error) {

        }


      });


    }



    /* ====================================================
       清空用户名密码
    ==================================================== */

    function clearLoginFields() {


      usernameInput.value = "";

      passwordInput.value = "";


    }



    /* ====================================================
       页面第一次打开
    ==================================================== */

    document.addEventListener(

      "DOMContentLoaded",

      function() {


        clearOldLoginData();

        clearLoginFields();



        /*
          先 readonly

          等浏览器自动填充动作结束以后
          再开放输入
        */

        setTimeout(

          function() {


            usernameInput.removeAttribute(
              "readonly"
            );


            passwordInput.removeAttribute(
              "readonly"
            );


            /*
              再清一次

              防止浏览器在页面加载过程中
              自动填入历史用户名密码
            */

            clearLoginFields();


            usernameInput.focus();


          },

          400

        );


        /*
          某些浏览器自动填充比较晚。

          再检查一次。
        */

        setTimeout(

          function() {


            clearLoginFields();


          },

          900

        );


      }

    );



    /* ====================================================
       浏览器后退到登录页
       也必须清空
    ==================================================== */

    window.addEventListener(

      "pageshow",

      function(event) {


        clearOldLoginData();


        setTimeout(

          function() {

            clearLoginFields();

          },

          100

        );


      }

    );



    /* ====================================================
       登录
    ==================================================== */

    loginForm.addEventListener(

      "submit",

      async function(event) {


        event.preventDefault();



        const username =
          usernameInput.value.trim();


        const password =
          passwordInput.value;



        message.textContent = "";

        message.className =
          "message";



        /* 用户名检查 */

        if (!username) {


          message.textContent =
            "请输入用户名。";


          message.className =
            "message error";


          usernameInput.focus();


          return;

        }



        /* 密码检查 */

        if (!password) {


          message.textContent =
            "请输入密码。";


          message.className =
            "message error";


          passwordInput.focus();


          return;

        }



        loginButton.disabled =
          true;


        loginButton.textContent =
          "正在登录...";



        try {


          /* ===============================================
             真正连接管理服务器
          =============================================== */


          const response =
            await fetch(

              LOGIN_API,

              {

                method: "POST",


                headers: {

                  "Content-Type":
                    "application/json",

                  "Accept":
                    "application/json"

                },


                /*
                  必须带上 Session Cookie
                */

                credentials:
                  "include",


                /*
                  不缓存登录请求
                */

                cache:
                  "no-store",


                body:
                  JSON.stringify({

                    username:
                      username,

                    password:
                      password

                  })

              }

            );



          /* ===============================================
             尝试读取服务器返回
          =============================================== */

          let result = {};


          const responseText =
            await response.text();



          if (responseText) {


            try {


              result =
                JSON.parse(
                  responseText
                );


            }

            catch (error) {


              result = {

                message:
                  responseText

              };


            }


          }



          /* ===============================================
             登录失败
          =============================================== */

          if (!response.ok) {


            let errorMessage =
              "用户名或密码错误。";


            if (
              result &&
              result.message
            ) {


              errorMessage =
                result.message;


            }


            else if (
              result &&
              result.detail
            ) {


              errorMessage =
                result.detail;


            }


            throw new Error(
              errorMessage
            );


          }



          /* ===============================================
             服务器明确返回失败
          =============================================== */

          if (

            result.success === false

            ||

            result.ok === false

          ) {


            throw new Error(

              result.message
              ||
              "用户名或密码错误。"

            );


          }



          /* ===============================================
             登录成功

             绝不保存用户名密码
          =============================================== */


          passwordInput.value = "";


          clearOldLoginData();



          message.textContent =
            "登录成功，正在进入管理中心...";


          message.className =
            "message success";



          /*
            使用 replace

            登录成功以后按浏览器后退键
            不应该回到带有登录信息的页面状态
          */

          setTimeout(

            function() {


              window.location.replace(
                MANAGEMENT_PAGE
              );


            },

            200

          );


        }



        catch (error) {


          /*
            登录失败后
            密码立即清空
          */

          passwordInput.value = "";



          /*
            网络错误与账号错误分开显示
          */

          if (
            error instanceof TypeError
          ) {


            message.textContent =
              "无法连接服务器，请检查服务器或网络连接。";


          }

          else {


            message.textContent =

              error.message
              ||
              "登录失败，请重新输入。";


          }


          message.className =
            "message error";


          passwordInput.focus();


        }



        finally {


          loginButton.disabled =
            false;


          loginButton.textContent =
            "登录";


        }


      }

    );



    /* ====================================================
       密码框禁止复制
    ==================================================== */

    passwordInput.addEventListener(

      "copy",

      function(event) {

        event.preventDefault();

      }

    );



    passwordInput.addEventListener(

      "cut",

      function(event) {

        event.preventDefault();

      }

    );



    /* ====================================================
       页面离开
       清空输入
    ==================================================== */

    window.addEventListener(

      "pagehide",

      function() {


        passwordInput.value = "";

        usernameInput.value = "";


      }

    );



    window.addEventListener(

      "beforeunload",

      function() {


        passwordInput.value = "";

        usernameInput.value = "";


      }

    );


  </script>


</body>

</html>
