<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>管理人员登录｜硕丰科技</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #f4f6f8;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Microsoft YaHei",
        Arial,
        sans-serif;

      color: #111827;
    }


    .login-container {

      width: 100%;
      max-width: 420px;

      padding: 42px 36px;

      background: #ffffff;

      border-radius: 14px;

      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.08);
    }


    /* ================================
       LOGO
    ================================= */

    .logo {

      text-align: center;

      margin-bottom: 8px;
    }


    .logo-title {

      margin: 0;

      font-size: 26px;

      font-weight: 700;

      color: #071124;

      letter-spacing: 1px;
    }


    .system-name {

      margin-top: 7px;

      font-size: 13px;

      color: #8b8b8b;
    }


    .login-title {

      margin-top: 30px;

      margin-bottom: 28px;

      text-align: center;

      font-size: 20px;

      font-weight: 700;

      color: #222222;
    }



    /* ================================
       FORM
    ================================= */

    .form-group {

      margin-bottom: 20px;
    }


    .form-label {

      display: block;

      margin-bottom: 8px;

      font-size: 14px;

      font-weight: 600;

      color: #333333;
    }


    .input-wrap {

      position: relative;
    }


    .form-input {

      width: 100%;

      height: 46px;

      padding: 0 14px;

      border:
        1px solid #d8dee8;

      border-radius: 8px;

      background: #eef4ff;

      color: #222;

      font-size: 14px;

      outline: none;

      transition:
        border-color 0.2s,
        box-shadow 0.2s;
    }


    .form-input:focus {

      border-color: #7da2d6;

      box-shadow:
        0 0 0 3px
        rgba(64, 115, 180, 0.12);
    }


    .password-input {

      padding-right: 65px;
    }


    .show-password {

      position: absolute;

      top: 50%;

      right: 14px;

      transform:
        translateY(-50%);

      padding: 0;

      border: none;

      background: transparent;

      color: #666;

      font-size: 13px;

      cursor: pointer;
    }



    /* ================================
       BUTTON
    ================================= */

    .login-button {

      width: 100%;

      height: 48px;

      margin-top: 2px;

      border: none;

      border-radius: 8px;

      background: #071124;

      color: #ffffff;

      font-size: 15px;

      font-weight: 700;

      cursor: pointer;

      transition:
        opacity 0.2s,
        transform 0.1s;
    }


    .login-button:hover {

      opacity: 0.94;
    }


    .login-button:active {

      transform:
        translateY(1px);
    }


    .login-button:disabled {

      opacity: 0.55;

      cursor: not-allowed;
    }



    .back-button {

      width: 100%;

      height: 46px;

      margin-top: 12px;

      border:
        1px solid #d8dee8;

      border-radius: 8px;

      background: #ffffff;

      color: #333333;

      font-size: 14px;

      cursor: pointer;
    }


    .back-button:hover {

      background: #f8fafc;
    }



    /* ================================
       MESSAGE
    ================================= */

    .message {

      display: none;

      margin-top: 16px;

      padding: 10px 12px;

      border-radius: 7px;

      font-size: 13px;

      line-height: 1.6;

      text-align: center;
    }


    .message.error {

      display: block;

      background: #fff1f1;

      border:
        1px solid #ffd5d5;

      color: #d93025;
    }


    .message.success {

      display: block;

      background: #effaf2;

      border:
        1px solid #cfeeda;

      color: #1f7a3f;
    }



    /* ================================
       SECURITY
    ================================= */

    .security-note {

      margin-top: 18px;

      padding: 12px 14px;

      background: #f7f8fa;

      border-radius: 8px;

      color: #777777;

      font-size: 12px;

      line-height: 1.7;
    }


    .copyright {

      margin-top: 26px;

      text-align: center;

      color: #aaaaaa;

      font-size: 12px;
    }



    /* ================================
       MOBILE
    ================================= */

    @media (
      max-width: 520px
    ) {

      body {

        align-items: flex-start;

        padding:
          30px 16px;
      }


      .login-container {

        margin-top: 30px;

        padding:
          34px 24px;
      }

    }

  </style>
</head>



<body>


<div class="login-container">


  <!-- =================================
       LOGO
  ================================== -->

  <div class="logo">

    <h1 class="logo-title">
      硕丰科技
    </h1>

    <div class="system-name">
      企业管理系统
    </div>

  </div>



  <div class="login-title">
    管理人员登录
  </div>



  <!-- =================================
       LOGIN FORM
  ================================== -->

  <form id="loginForm">


    <!-- EMAIL -->

    <div class="form-group">

      <label
        class="form-label"
        for="email"
      >
        邮箱
      </label>


      <input
        id="email"
        class="form-input"
        type="email"

        autocomplete="username"

        placeholder="请输入邮箱"

        required
      >

    </div>



    <!-- PASSWORD -->

    <div class="form-group">

      <label
        class="form-label"
        for="password"
      >
        密码
      </label>


      <div class="input-wrap">


        <input
          id="password"

          class="
            form-input
            password-input
          "

          type="password"

          autocomplete="current-password"

          placeholder="请输入密码"

          required
        >


        <button
          id="togglePassword"

          class="show-password"

          type="button"
        >
          显示
        </button>


      </div>

    </div>



    <!-- LOGIN -->

    <button
      id="loginButton"

      class="login-button"

      type="submit"
    >
      登录系统
    </button>



    <!-- BACK -->

    <button
      class="back-button"

      type="button"

      onclick="
        window.location.href='/'
      "
    >
      返回首页
    </button>



    <!-- MESSAGE -->

    <div
      id="message"

      class="message"
    ></div>



    <!-- SECURITY -->

    <div class="security-note">

      本页面仅供公司授权管理人员使用。

      用户身份由 Supabase Auth 验证，
      系统权限由数据库统一验证。

    </div>


  </form>



  <div class="copyright">
    © 2026 硕丰科技
  </div>


</div>



<script>


/* ============================================================
   1. Supabase 配置
============================================================ */


const SUPABASE_URL =
  'https://icmifhjjhgjrhkunjbmu.supabase.co';



/*
  这里粘贴你之前已经使用成功的：

  sb_publishable_......

  注意：
  不要使用 sb_secret_
*/

const SUPABASE_ANON_KEY =
  '这里粘贴你的sb_publishable_key';



/* ============================================================
   2. Supabase Client
============================================================ */


const supabaseClient =
  window.supabase.createClient(

    SUPABASE_URL,

    SUPABASE_ANON_KEY

  );



/* ============================================================
   3. 页面元素
============================================================ */


const loginForm =
  document.getElementById(
    'loginForm'
  );


const emailInput =
  document.getElementById(
    'email'
  );


const passwordInput =
  document.getElementById(
    'password'
  );


const togglePassword =
  document.getElementById(
    'togglePassword'
  );


const loginButton =
  document.getElementById(
    'loginButton'
  );


const messageBox =
  document.getElementById(
    'message'
  );



/* ============================================================
   4. 信息提示
============================================================ */


function showMessage(
  text,
  type = 'error'
) {


  messageBox.textContent =
    text;


  messageBox.className =
    'message ' + type;

}



function clearMessage() {


  messageBox.textContent =
    '';


  messageBox.className =
    'message';

}



/* ============================================================
   5. 显示 / 隐藏密码
============================================================ */


togglePassword.addEventListener(

  'click',

  function () {


    if (
      passwordInput.type ===
      'password'
    ) {


      passwordInput.type =
        'text';


      togglePassword.textContent =
        '隐藏';


    } else {


      passwordInput.type =
        'password';


      togglePassword.textContent =
        '显示';

    }

  }

);



/* ============================================================
   6. 登录
============================================================ */


loginForm.addEventListener(

  'submit',

  async function (event) {


    event.preventDefault();


    clearMessage();



    const email =
      emailInput.value.trim();


    const password =
      passwordInput.value;



    if (
      !email ||
      !password
    ) {


      showMessage(
        '请输入邮箱和密码。'
      );


      return;

    }



    loginButton.disabled =
      true;


    loginButton.textContent =
      '正在登录...';



    try {


      /* ======================================================
         A. Supabase Auth 登录
      ====================================================== */


      const {

        data: authData,

        error: authError

      } =

        await supabaseClient.auth
          .signInWithPassword({

            email:
              email,

            password:
              password

          });



      if (authError) {


        console.error(
          'Auth error:',
          authError
        );


        showMessage(
          '登录失败，请检查邮箱或密码。'
        );


        return;

      }



      if (
        !authData ||
        !authData.user
      ) {


        showMessage(
          '登录失败，没有取得用户资料。'
        );


        return;

      }



      const user =
        authData.user;



      /* ======================================================
         B. 读取 profiles 权限
      ====================================================== */


      const {

        data: profile,

        error: profileError

      } =

        await supabaseClient

          .from('profiles')

          .select(
            'id, display_name, role, is_active'
          )

          .eq(
            'id',
            user.id
          )

          .single();



      if (profileError) {


        console.error(
          'Profile error:',
          profileError
        );


        await supabaseClient.auth
          .signOut();


        showMessage(
          '读取用户权限失败：' +
          profileError.message
        );


        return;

      }



      if (!profile) {


        await supabaseClient.auth
          .signOut();


        showMessage(
          '该账号尚未配置管理权限。'
        );


        return;

      }



      /* ======================================================
         C. 账号有效状态
      ====================================================== */


      if (
        profile.is_active !== true
      ) {


        await supabaseClient.auth
          .signOut();


        showMessage(
          '该管理账号目前已停用。'
        );


        return;

      }



      /* ======================================================
         D. 管理人员权限
      ====================================================== */


      if (

        profile.role !==
        'founder'

        &&

        profile.role !==
        'admin'

      ) {


        await supabaseClient.auth
          .signOut();


        showMessage(
          '该账号不是公司管理人员账号。'
        );


        return;

      }



      /* ======================================================
         E. 保存页面显示资料

         注意：
         真正的权限仍由数据库 RLS 控制。
      ====================================================== */


      sessionStorage.setItem(

        'sf_user_id',

        user.id

      );


      sessionStorage.setItem(

        'sf_display_name',

        profile.display_name || ''

      );


      sessionStorage.setItem(

        'sf_role',

        profile.role

      );



      /* ======================================================
         F. 登录成功
      ====================================================== */


      showMessage(

        '登录成功，正在进入公司管理后台...',

        'success'

      );



      setTimeout(

        function () {


          window.location.href =
            'wholemanagement.html';


        },

        300

      );



    } catch (error) {


      console.error(
        'Login exception:',
        error
      );


      showMessage(
        '系统连接失败，请稍后重新登录。'
      );


    } finally {


      loginButton.disabled =
        false;


      loginButton.textContent =
        '登录系统';

    }

  }

);



/* ============================================================
   7. 页面加载

   特别注意：

   page10 是“登录页面”。

   即使浏览器里还有旧 Session，
   这里也不会自动跳转 wholemanagement。

   所以打开 /page10 永远先看到登录框。
============================================================ */


emailInput.focus();


</script>


</body>
</html>
