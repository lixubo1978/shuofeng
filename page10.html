<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>管理人员登录｜硕丰科技</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Microsoft YaHei",
        Arial,
        sans-serif;

      background: #f4f6f8;

      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-container {
      width: 100%;
      max-width: 420px;

      background: #ffffff;

      padding: 42px 36px;

      border-radius: 14px;

      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.08);
    }

    .logo {
      text-align: center;
      margin-bottom: 10px;
    }

    .logo-title {
      font-size: 25px;
      font-weight: 700;
      color: #111827;
      letter-spacing: 1px;
    }

    .logo-subtitle {
      margin-top: 5px;
      font-size: 13px;
      color: #6b7280;
    }

    .login-title {
      margin-top: 30px;
      margin-bottom: 26px;

      text-align: center;

      font-size: 20px;
      font-weight: 600;

      color: #1f2937;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;

      margin-bottom: 8px;

      font-size: 14px;
      font-weight: 600;

      color: #374151;
    }

    input {
      width: 100%;

      padding: 12px 13px;

      border: 1px solid #d1d5db;

      border-radius: 8px;

      font-size: 15px;

      outline: none;

      background: #ffffff;

      transition:
        border-color 0.2s,
        box-shadow 0.2s;
    }

    input:focus {
      border-color: #2563eb;

      box-shadow:
        0 0 0 3px rgba(37, 99, 235, 0.10);
    }

    .login-button {
      width: 100%;

      margin-top: 8px;

      padding: 13px;

      border: none;

      border-radius: 8px;

      background: #0f172a;

      color: #ffffff;

      font-size: 15px;
      font-weight: 600;

      cursor: pointer;

      transition: 0.2s;
    }

    .login-button:hover {
      background: #1e293b;
    }

    .login-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      min-height: 20px;

      margin-top: 16px;

      text-align: center;

      font-size: 13px;
      font-weight: 500;
    }

    .message.error {
      color: #dc2626;
    }

    .message.success {
      color: #059669;
    }

    .security-note {
      margin-top: 26px;

      padding-top: 18px;

      border-top: 1px solid #e5e7eb;

      text-align: center;

      font-size: 12px;
      color: #9ca3af;

      line-height: 1.6;
    }

    @media (max-width: 520px) {

      body {
        padding: 18px;
      }

      .login-container {
        padding: 34px 24px;
      }

    }
  </style>
</head>


<body>

  <div class="login-container">

    <div class="logo">

      <div class="logo-title">
        硕丰科技
      </div>

      <div class="logo-subtitle">
        ShuoFeng Technology
      </div>

    </div>


    <div class="login-title">
      管理人员登录
    </div>


    <!--
      autocomplete="off"
      尽量禁止浏览器自动填充整个表单
    -->

    <form
      id="loginForm"
      autocomplete="off"
      method="post"
      onsubmit="return handleLogin(event)"
    >

      <!--
        这两个隐藏输入框是为了降低部分浏览器
        自动把保存过的用户名密码填入真实登录框的概率
      -->

      <input
        type="text"
        name="fake_username"
        autocomplete="username"
        style="
          position:absolute;
          left:-9999px;
          width:1px;
          height:1px;
          opacity:0;
        "
        tabindex="-1"
      >

      <input
        type="password"
        name="fake_password"
        autocomplete="current-password"
        style="
          position:absolute;
          left:-9999px;
          width:1px;
          height:1px;
          opacity:0;
        "
        tabindex="-1"
      >


      <div class="form-group">

        <label for="username">
          用户名
        </label>

        <input
          id="username"
          name="management_user_input"
          type="text"

          autocomplete="off"
          autocorrect="off"
          autocapitalize="none"
          spellcheck="false"

          readonly

          required
        >

      </div>


      <div class="form-group">

        <label for="password">
          密码
        </label>

        <input
          id="password"
          name="management_password_input"
          type="password"

          autocomplete="new-password"

          readonly

          required
        >

      </div>


      <button
        id="loginButton"
        class="login-button"
        type="submit"
      >
        登录
      </button>


      <div
        id="message"
        class="message"
      ></div>

    </form>


    <div class="security-note">
      为保护管理系统安全，本页面不会保留登录用户名和密码。
      每次登录均需重新输入。
    </div>

  </div>



  <script>

    /* =====================================================
       硕丰管理人员登录页面
       强制禁止保存 / 恢复登录信息
    ===================================================== */


    const usernameInput =
      document.getElementById("username");

    const passwordInput =
      document.getElementById("password");

    const loginForm =
      document.getElementById("loginForm");

    const loginButton =
      document.getElementById("loginButton");

    const message =
      document.getElementById("message");


    /* =====================================================
       每次进入登录页
       清除可能残留的登录数据
    ===================================================== */

    function clearSavedLoginData() {

      /*
        清空浏览器会话数据
      */

      sessionStorage.removeItem(
        "managementLogin"
      );

      sessionStorage.removeItem(
        "managementUser"
      );

      sessionStorage.removeItem(
        "managementRole"
      );

      sessionStorage.removeItem(
        "loginTime"
      );


      /*
        清空localStorage中可能存在的登录信息
      */

      localStorage.removeItem(
        "managementLogin"
      );

      localStorage.removeItem(
        "managementUser"
      );

      localStorage.removeItem(
        "managementRole"
      );

      localStorage.removeItem(
        "loginTime"
      );

      localStorage.removeItem(
        "username"
      );

      localStorage.removeItem(
        "password"
      );

    }


    /* =====================================================
       强制清空输入框
    ===================================================== */

    function clearLoginFields() {

      usernameInput.value = "";

      passwordInput.value = "";

    }


    /* =====================================================
       页面打开时执行
    ===================================================== */

    window.addEventListener(
      "DOMContentLoaded",
      function() {

        clearSavedLoginData();

        clearLoginFields();


        /*
          readonly可以减少部分浏览器
          在页面加载时自动填入账号密码。

          页面加载后稍微延迟再允许用户输入。
        */

        setTimeout(
          function() {

            usernameInput.removeAttribute(
              "readonly"
            );

            passwordInput.removeAttribute(
              "readonly"
            );

          },
          300
        );

      }
    );


    /* =====================================================
       防止浏览器后退缓存恢复账号密码
    ===================================================== */

    window.addEventListener(
      "pageshow",
      function(event) {

        clearSavedLoginData();

        clearLoginFields();

      }
    );


    /* =====================================================
       页面失去 / 恢复焦点时
       不自动恢复任何历史账号
    ===================================================== */

    window.addEventListener(
      "focus",
      function() {

        /*
          这里只清除保存信息，
          不清除正在输入的内容，
          防止用户切换窗口回来后重新输入。
        */

        clearSavedLoginData();

      }
    );


    /* =====================================================
       禁止复制密码
       可减少简单复制泄露
    ===================================================== */

    passwordInput.addEventListener(
      "copy",
      function(event) {

        event.preventDefault();

      }
    );


    passwordInput.addEventListener(
      "cut",
      function(event) {

        event.preventDefault();

      }
    );


    /* =====================================================
       登录函数
    ===================================================== */

    async function handleLogin(event) {

      event.preventDefault();


      const username =
        usernameInput.value.trim();

      const password =
        passwordInput.value;


      message.textContent = "";
      message.className = "message";


      if (!username) {

        message.textContent =
          "请输入用户名。";

        message.className =
          "message error";

        usernameInput.focus();

        return false;

      }


      if (!password) {

        message.textContent =
          "请输入密码。";

        message.className =
          "message error";

        passwordInput.focus();

        return false;

      }


      loginButton.disabled = true;

      loginButton.textContent =
        "正在登录...";


      try {

        /*
          ============================
          后期连接Python服务器时
          把这里替换为真实API
          ============================

          示例：

          const response = await fetch(
            "/api/management/login",
            {
              method: "POST",
              headers: {
                "Content-Type":
                  "application/json"
              },
              credentials: "include",
              body: JSON.stringify({
                username: username,
                password: password
              })
            }
          );

          const result =
            await response.json();

          if (!response.ok) {
            throw new Error(
              result.message ||
              "用户名或密码错误"
            );
          }

          window.location.replace(
            "wholemanagement.html"
          );

        */


        /*
          当前如果你的登录API已经存在，
          请把你原来的fetch登录代码
          放在上面的区域。

          不要把用户名或密码保存到：
          localStorage
          sessionStorage
          Cookie明文
        */


        /*
          这里只是占位提示。
          正式连接数据库后删除。
        */

        message.textContent =
          "请连接后台登录接口。";

        message.className =
          "message error";


      }
      catch (error) {

        message.textContent =
          error.message ||
          "登录失败，请重新输入。";

        message.className =
          "message error";

      }
      finally {

        /*
          无论成功失败，
          都不保存密码
        */

        passwordInput.value = "";

        loginButton.disabled = false;

        loginButton.textContent =
          "登录";

      }


      return false;

    }


    /* =====================================================
       页面关闭 / 刷新
       不保存任何输入
    ===================================================== */

    window.addEventListener(
      "beforeunload",
      function() {

        passwordInput.value = "";

      }
    );

  </script>

</body>
</html>
