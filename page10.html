<!DOCTYPE html>
<html lang="zh-CN">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    http-equiv="Cache-Control"
    content="no-store, no-cache, must-revalidate, max-age=0"
  >

  <meta
    http-equiv="Pragma"
    content="no-cache"
  >

  <meta
    http-equiv="Expires"
    content="0"
  >

  <title>管理人员登录｜硕丰科技</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;
      padding: 0;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Microsoft YaHei",
        Arial,
        sans-serif;

      background: #f4f6f8;

      min-height: 100vh;

      display: flex;

      align-items: flex-start;

      justify-content: center;

      padding-top: 0;
    }


    /* =====================================================
       登录主卡片
       风格与 page11 对齐
    ===================================================== */

    .login-container {

      width: 100%;

      max-width: 500px;

      min-height: 100vh;

      background: #ffffff;

      padding:
        54px 42px 40px;

      box-shadow:
        0 0 35px rgba(15, 23, 42, 0.06);
    }


    /* =====================================================
       Logo
    ===================================================== */

    .logo {

      text-align: center;

      margin-bottom: 36px;
    }


    .logo-title {

      font-size: 28px;

      font-weight: 800;

      color: #111827;

      letter-spacing: 1px;
    }


    .logo-subtitle {

      margin-top: 7px;

      font-size: 15px;

      color: #6b7280;
    }


    /* =====================================================
       登录标题
    ===================================================== */

    .login-title {

      margin-top: 0;

      margin-bottom: 36px;

      text-align: center;

      font-size: 24px;

      font-weight: 700;

      color: #1f2937;
    }


    /* =====================================================
       表单
    ===================================================== */

    .form-group {

      margin-bottom: 22px;
    }


    label {

      display: block;

      margin-bottom: 9px;

      font-size: 15px;

      font-weight: 700;

      color: #374151;
    }


    input {

      width: 100%;

      height: 58px;

      padding:
        0 16px;

      border:
        1px solid #d1d5db;

      border-radius: 9px;

      font-size: 18px;

      outline: none;

      background: #ffffff;

      color: #111827;

      transition:
        border-color 0.2s,
        box-shadow 0.2s;
    }


    input::placeholder {

      color: #9ca3af;
    }


    input:focus {

      border-color: #2563eb;

      box-shadow:
        0 0 0 3px rgba(37, 99, 235, 0.10);
    }


    /* =====================================================
       密码显示按钮
    ===================================================== */

    .password-wrapper {

      position: relative;
    }


    .password-wrapper input {

      padding-right: 72px;
    }


    .password-toggle {

      position: absolute;

      right: 14px;

      top: 50%;

      transform:
        translateY(-50%);

      border: none;

      background: transparent;

      color: #4b5563;

      font-size: 14px;

      cursor: pointer;

      padding:
        6px 4px;
    }


    .password-toggle:hover {

      color: #111827;
    }


    /* =====================================================
       登录按钮
    ===================================================== */

    .login-button {

      width: 100%;

      margin-top: 14px;

      height: 64px;

      border: none;

      border-radius: 9px;

      background: #0f172a;

      color: #ffffff;

      font-size: 18px;

      font-weight: 700;

      cursor: pointer;

      transition:
        background 0.2s,
        opacity 0.2s;
    }


    .login-button:hover {

      background: #1e293b;
    }


    .login-button:disabled {

      opacity: 0.6;

      cursor: not-allowed;
    }


    /* =====================================================
       返回首页
    ===================================================== */

    .home-button {

      width: 100%;

      margin-top: 14px;

      height: 62px;

      border:
        1px solid #d1d5db;

      border-radius: 9px;

      background: #ffffff;

      color: #374151;

      font-size: 17px;

      font-weight: 700;

      cursor: pointer;

      transition:
        background 0.2s,
        border-color 0.2s;
    }


    .home-button:hover {

      background: #f9fafb;

      border-color: #9ca3af;
    }


    /* =====================================================
       提示
    ===================================================== */

    .message {

      min-height: 24px;

      margin-top: 18px;

      text-align: center;

      font-size: 13px;

      font-weight: 600;

      line-height: 1.6;
    }


    .message.error {

      color: #dc2626;
    }


    .message.success {

      color: #059669;
    }


    /* =====================================================
       底部说明
    ===================================================== */

    .security-note {

      margin-top: 58px;

      padding:
        17px 16px;

      background: #f8fafc;

      border-radius: 9px;

      color: #6b7280;

      text-align: left;

      font-size: 12px;

      line-height: 1.8;
    }


    @media (max-width: 520px) {

      body {

        align-items: stretch;

      }


      .login-container {

        max-width: none;

        padding:
          42px 24px 32px;

      }


      .logo-title {

        font-size: 26px;

      }


      .login-title {

        font-size: 22px;

      }


      input {

        font-size: 16px;

      }

    }

  </style>

</head>



<body>


  <div class="login-container">


    <!-- =====================================================
         Logo
    ====================================================== -->

    <div class="logo">


      <div class="logo-title">

        硕丰科技

      </div>


      <div class="logo-subtitle">

        企业管理系统

      </div>


    </div>



    <!-- =====================================================
         标题
    ====================================================== -->

    <div class="login-title">

      管理人员登录

    </div>



    <!-- =====================================================
         登录表单
    ====================================================== -->

    <form
      id="loginForm"
      autocomplete="off"
    >


      <!-- =================================================
           降低浏览器自动填充概率
      ================================================== -->

      <input
        type="text"
        autocomplete="username"
        tabindex="-1"
        aria-hidden="true"
        style="
          position:absolute;
          left:-10000px;
          top:-10000px;
          width:1px;
          height:1px;
          opacity:0;
        "
      >


      <input
        type="password"
        autocomplete="current-password"
        tabindex="-1"
        aria-hidden="true"
        style="
          position:absolute;
          left:-10000px;
          top:-10000px;
          width:1px;
          height:1px;
          opacity:0;
        "
      >



      <!-- =================================================
           用户名
      ================================================== -->

      <div class="form-group">


        <label for="username">

          登录邮箱

        </label>


        <input
          id="username"
          name="management_login_username"
          type="text"

          placeholder="请输入管理人员登录邮箱"

          autocomplete="off"
          autocorrect="off"
          autocapitalize="none"
          spellcheck="false"

          readonly
          required
        >


      </div>



      <!-- =================================================
           密码
      ================================================== -->

      <div class="form-group">


        <label for="password">

          密码

        </label>


        <div class="password-wrapper">


          <input
            id="password"
            name="management_login_password"
            type="password"

            placeholder="请输入密码"

            autocomplete="new-password"

            readonly
            required
          >


          <button
            id="passwordToggle"
            class="password-toggle"
            type="button"
            onclick="togglePassword()"
          >
            显示
          </button>


        </div>


      </div>



      <!-- =================================================
           登录
      ================================================== -->

      <button
        id="loginButton"
        class="login-button"
        type="submit"
      >

        登录管理系统

      </button>



      <!-- =================================================
           返回首页
      ================================================== -->

      <button
        class="home-button"
        type="button"
        onclick="goHome()"
      >

        返回首页

      </button>



      <!-- =================================================
           提示
      ================================================== -->

      <div
        id="message"
        class="message"
      ></div>


    </form>



    <!-- =====================================================
         安全说明
    ====================================================== -->

    <div class="security-note">

      本页面仅供硕丰科技公司管理人员使用。

      <br>

      只有有效的公司管理账号可以进入管理系统。

      <br>

      系统仅允许 founder / admin 权限账号登录。

      <br>

      本页面不保存登录用户名和密码。

    </div>


  </div>



  <!-- =====================================================
       Supabase
  ====================================================== -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>


  <script>

    /* =====================================================
       Supabase 配置
    ===================================================== */

    const SUPABASE_URL =
      "https://icmifhjjhgjrhkunjbmu.supabase.co";


    const SUPABASE_KEY =
      "sb_publishable_PR-D5FTznDtffymRmANXqQ_a5qYXrI4";


    const sb =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {

          auth: {

            persistSession:
              true,

            autoRefreshToken:
              true,

            detectSessionInUrl:
              true

          }

        }
      );


    const MANAGEMENT_PAGE =
      "wholemanagement.html";


    const usernameInput =
      document.getElementById(
        "username"
      );


    const passwordInput =
      document.getElementById(
        "password"
      );


    const loginForm =
      document.getElementById(
        "loginForm"
      );


    const loginButton =
      document.getElementById(
        "loginButton"
      );


    const message =
      document.getElementById(
        "message"
      );


    const passwordToggle =
      document.getElementById(
        "passwordToggle"
      );



    /* =====================================================
       显示 / 隐藏密码
    ===================================================== */

    function togglePassword() {


      if (
        passwordInput.type ===
        "password"
      ) {


        passwordInput.type =
          "text";


        passwordToggle.textContent =
          "隐藏";


      }

      else {


        passwordInput.type =
          "password";


        passwordToggle.textContent =
          "显示";


      }

    }



    /* =====================================================
       返回主页
    ===================================================== */

    function goHome() {


      clearLoginFields();


      window.location.href =
        "index.html";

    }



    /* =====================================================
       清除旧前端登录数据
       不在这里清除 Supabase Session
    ===================================================== */

    function clearOldLocalData() {


      const keys = [

        "managementLogin",
        "managementUser",
        "managementRole",
        "loginTime",
        "username",
        "password"

      ];


      keys.forEach(
        function(key) {


          try {


            localStorage.removeItem(
              key
            );


          }

          catch (error) {}



          try {


            sessionStorage.removeItem(
              key
            );


          }

          catch (error) {}


        }
      );

    }



    /* =====================================================
       清空用户名密码
    ===================================================== */

    function clearLoginFields() {


      usernameInput.value =
        "";


      passwordInput.value =
        "";


      passwordInput.type =
        "password";


      passwordToggle.textContent =
        "显示";

    }



    /* =====================================================
       页面打开
    ===================================================== */

    document.addEventListener(
      "DOMContentLoaded",

      function() {


        clearOldLocalData();


        clearLoginFields();



        setTimeout(
          function() {


            usernameInput.removeAttribute(
              "readonly"
            );


            passwordInput.removeAttribute(
              "readonly"
            );


            clearLoginFields();


            usernameInput.focus();


          },
          350
        );



        setTimeout(
          function() {


            clearLoginFields();


          },
          800
        );


      }
    );



    /* =====================================================
       浏览器后退到登录页面
    ===================================================== */

    window.addEventListener(
      "pageshow",

      function() {


        clearOldLocalData();



        setTimeout(
          function() {


            clearLoginFields();


          },
          100
        );


      }
    );



    /* =====================================================
       检查当前账号是否属于公司管理人员

       允许：
       founder
       admin

       禁止：
       agent
       其他角色
       无 profile
       is_active=false
    ===================================================== */

    async function verifyManagementProfile(
      user
    ) {


      if (
        !user
        ||
        !user.id
      ) {


        throw new Error(
          "无法读取当前登录用户。"
        );

      }



      let profile =
        null;


      let lastError =
        null;



      /*
        最多读取3次，
        对刚刚创建的管理账号更稳妥。
      */

      for (
        let attempt = 1;
        attempt <= 3;
        attempt++
      ) {


        const {
          data,
          error
        } =
          await sb
            .from(
              "profiles"
            )
            .select(
              "id, display_name, role, is_active"
            )
            .eq(
              "id",
              user.id
            )
            .maybeSingle();



        if (
          !error
          &&
          data
        ) {


          profile =
            data;


          lastError =
            null;


          break;

        }



        lastError =
          error;



        if (
          attempt < 3
        ) {


          await new Promise(
            resolve =>
              setTimeout(
                resolve,
                300
              )
          );


        }

      }



      /* =================================================
         没有 profiles
      ================================================== */

      if (
        !profile
      ) {


        console.error(
          "没有找到 profiles：",
          lastError
        );


        throw new Error(
          "该账号没有公司管理人员资料，禁止进入管理系统。"
        );

      }



      /* =================================================
         已经停用
      ================================================== */

      if (
        profile.is_active !==
        true
      ) {


        throw new Error(
          "该账号已经停用，禁止进入管理系统。"
        );

      }



      /* =================================================
         核心管理权限
      ================================================== */

      const allowed =
        profile.role ===
        "founder"
        ||
        profile.role ===
        "admin";


      if (
        !allowed
      ) {


        console.warn(
          "非管理人员尝试从 page10 登录：",
          {

            userId:
              user.id,

            role:
              profile.role

          }
        );


        throw new Error(
          "该账号不是公司管理人员，禁止进入管理系统。"
        );

      }


      return profile;

    }



    /* =====================================================
       登录
    ===================================================== */

    loginForm.addEventListener(
      "submit",

      async function(event) {


        event.preventDefault();



        const email =
          usernameInput
            .value
            .trim();



        const password =
          passwordInput.value;



        message.textContent =
          "";


        message.className =
          "message";



        if (
          !email
        ) {


          message.textContent =
            "请输入登录邮箱。";


          message.className =
            "message error";


          usernameInput.focus();


          return;

        }



        if (
          !password
        ) {


          message.textContent =
            "请输入密码。";


          message.className =
            "message error";


          passwordInput.focus();


          return;

        }



        loginButton.disabled =
          true;


        loginButton.textContent =
          "正在验证身份...";



        try {


          /* =================================================
             第一级：
             Supabase Auth 验证邮箱和密码
          ================================================== */

          const {
            data,
            error
          } =
            await sb
              .auth
              .signInWithPassword({

                email:
                  email,

                password:
                  password

              });



          if (
            error
          ) {


            throw error;

          }



          if (
            !data
            ||
            !data.user
            ||
            !data.session
          ) {


            throw new Error(
              "登录失败，请重新输入。"
            );

          }



          /* =================================================
             第二级：
             profiles 权限检查
          ================================================== */

          loginButton.textContent =
            "正在检查管理权限...";



          let profile;



          try {


            profile =
              await verifyManagementProfile(
                data.user
              );


          }

          catch (
            permissionError
          ) {


            /*
              非管理账号虽然 Auth 已经登录成功，
              这里必须立即退出 Session。
            */

            try {


              await sb
                .auth
                .signOut();


            }

            catch (
              signOutError
            ) {


              console.error(
                "拒绝登录后退出 Session 失败：",
                signOutError
              );


            }



            throw permissionError;

          }



          /*
            到这里说明：

            1. 邮箱密码正确
            2. profiles 存在
            3. is_active=true
            4. role=founder/admin
          */


          clearLoginFields();


          clearOldLocalData();



          message.textContent =
            (
              profile.display_name
              ?
              profile.display_name
              +
              "，"
              :
              ""
            )
            +
            "管理身份验证成功，正在进入管理中心...";


          message.className =
            "message success";



          setTimeout(
            function() {


              window.location.replace(
                MANAGEMENT_PAGE
              );


            },
            200
          );


        }


        catch (error) {


          passwordInput.value =
            "";


          passwordInput.type =
            "password";


          passwordToggle.textContent =
            "显示";



          let errorMessage =
            "登录邮箱或密码错误。";



          if (
            error
            &&
            error.message
          ) {


            const rawMessage =
              error.message;


            const msg =
              rawMessage.toLowerCase();



            if (
              msg.includes(
                "invalid login credentials"
              )
            ) {


              errorMessage =
                "登录邮箱或密码错误。";


            }


            else if (
              msg.includes(
                "email not confirmed"
              )
            ) {


              errorMessage =
                "该账号尚未完成邮箱确认。";


            }


            else if (
              msg.includes(
                "failed to fetch"
              )
            ) {


              errorMessage =
                "无法连接 Supabase，请检查网络连接。";


            }


            else if (
              msg.includes(
                "不是公司管理人员"
              )
              ||
              msg.includes(
                "没有公司管理人员资料"
              )
              ||
              msg.includes(
                "已经停用"
              )
            ) {


              errorMessage =
                rawMessage;


            }


            else {


              errorMessage =
                rawMessage;


            }


          }



          message.textContent =
            errorMessage;


          message.className =
            "message error";


          passwordInput.focus();


        }


        finally {


          loginButton.disabled =
            false;


          loginButton.textContent =
            "登录管理系统";


        }


      }
    );



    /* =====================================================
       密码禁止复制
    ===================================================== */

    passwordInput.addEventListener(
      "copy",

      function(event) {


        event.preventDefault();


      }
    );


    passwordInput.addEventListener(
      "cut",

      function(event) {


        event.preventDefault();


      }
    );



    /* =====================================================
       离开登录页时清空输入框
    ===================================================== */

    window.addEventListener(
      "pagehide",

      function() {


        clearLoginFields();


      }
    );


    window.addEventListener(
      "beforeunload",

      function() {


        clearLoginFields();


      }
    );


  </script>


</body>

</html>
