<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>管理人员登录｜硕丰科技</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;

      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "Microsoft YaHei", Arial, sans-serif;

      background: #f4f6f8;

      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-container {
      width: 100%;
      max-width: 420px;

      background: #ffffff;

      padding: 42px 36px;

      border-radius: 14px;

      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.08);
    }

    .logo {
      text-align: center;
      margin-bottom: 10px;
    }

    .logo-title {
      font-size: 26px;
      font-weight: 700;
      color: #0b1220;
    }

    .logo-subtitle {
      margin-top: 6px;
      font-size: 14px;
      color: #777;
    }

    h2 {
      text-align: center;

      margin-top: 30px;
      margin-bottom: 30px;

      font-size: 21px;
      color: #222;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;

      margin-bottom: 8px;

      font-size: 14px;
      font-weight: 600;

      color: #333;
    }

    input {
      width: 100%;

      padding: 13px 14px;

      border: 1px solid #d8dde3;
      border-radius: 8px;

      font-size: 15px;

      outline: none;

      transition: 0.2s;
    }

    input:focus {
      border-color: #1f6feb;

      box-shadow:
        0 0 0 3px rgba(31, 111, 235, 0.10);
    }

    .password-wrapper {
      position: relative;
    }

    .password-wrapper input {
      padding-right: 65px;
    }

    .show-password {
      position: absolute;

      right: 12px;
      top: 50%;

      transform: translateY(-50%);

      border: none;
      background: none;

      cursor: pointer;

      color: #555;

      font-size: 13px;
    }

    .login-btn {
      width: 100%;

      margin-top: 8px;

      padding: 14px;

      border: none;
      border-radius: 8px;

      background: #0b1220;
      color: white;

      font-size: 16px;
      font-weight: 600;

      cursor: pointer;

      transition: 0.2s;
    }

    .login-btn:hover {
      background: #1d2a3d;
    }

    .login-btn:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .back-btn {
      display: block;

      width: 100%;

      margin-top: 12px;

      padding: 13px;

      border: 1px solid #d8dde3;
      border-radius: 8px;

      background: #ffffff;
      color: #333;

      font-size: 15px;
      font-weight: 600;

      text-align: center;
      text-decoration: none;

      cursor: pointer;

      transition: 0.2s;
    }

    .back-btn:hover {
      background: #f4f6f8;
      border-color: #bfc6ce;
    }

    .message {
      margin-top: 18px;

      text-align: center;

      font-size: 14px;

      min-height: 20px;

      line-height: 1.5;

      word-break: break-word;
    }

    .error {
      color: #d93025;
    }

    .success {
      color: #188038;
    }

    .footer {
      margin-top: 30px;

      text-align: center;

      font-size: 12px;

      color: #999;
    }

    .security-note {
      margin-top: 20px;

      padding: 12px;

      background: #f7f8fa;

      border-radius: 8px;

      color: #666;

      font-size: 12px;

      line-height: 1.6;
    }

  </style>
</head>


<body>

<div class="login-container">

  <div class="logo">

    <div class="logo-title">
      硕丰科技
    </div>

    <div class="logo-subtitle">
      企业管理系统
    </div>

  </div>


  <h2>
    管理人员登录
  </h2>


  <form id="loginForm">

    <div class="form-group">

      <label for="email">
        邮箱
      </label>

      <input
        type="email"
        id="email"
        name="email"
        placeholder="请输入登录邮箱"
        autocomplete="username"
        required
      >

    </div>


    <div class="form-group">

      <label for="password">
        密码
      </label>


      <div class="password-wrapper">

        <input
          type="password"
          id="password"
          name="password"
          placeholder="请输入密码"
          autocomplete="current-password"
          required
        >


        <button
          type="button"
          class="show-password"
          onclick="togglePassword()"
        >
          显示
        </button>

      </div>

    </div>


    <button
      type="submit"
      class="login-btn"
      id="loginBtn"
    >
      登录系统
    </button>


    <a
      href="index.html"
      class="back-btn"
    >
      返回首页
    </a>


    <div
      id="message"
      class="message"
    ></div>

  </form>


  <div class="security-note">
    本页面仅供公司授权管理人员使用。
    用户身份由 Supabase Auth 验证，
    系统权限由数据库统一验证。
  </div>


  <div class="footer">
    © 2026 硕丰科技
  </div>

</div>



<!-- Supabase JavaScript -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

  /*
   * ========================================
   * Supabase 配置
   * ========================================
   */

  const SUPABASE_URL =
    "https://icmifhjjhgjrhkunjbmu.supabase.co";


  const SUPABASE_ANON_KEY =
    "sb_publishable_PR-D5FTznDtffymRmANXqQ_a5qYXrI4";


  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );



  /*
   * ========================================
   * 获取页面元素
   * ========================================
   */

  const loginForm =
    document.getElementById("loginForm");


  const loginBtn =
    document.getElementById("loginBtn");


  const message =
    document.getElementById("message");



  /*
   * ========================================
   * 登录
   * ========================================
   */

  loginForm.addEventListener(
    "submit",

    async function(event) {

      event.preventDefault();


      const email =
        document
          .getElementById("email")
          .value
          .trim();


      const password =
        document
          .getElementById("password")
          .value;


      /*
       * 检查输入
       */

      if (!email || !password) {

        showMessage(
          "请输入邮箱和密码",
          "error"
        );

        return;
      }


      /*
       * 登录按钮进入等待状态
       */

      loginBtn.disabled = true;

      loginBtn.innerText =
        "正在登录...";


      showMessage(
        "",
        ""
      );


      try {

        /*
         * ========================================
         * 第一步
         * Supabase Auth 验证邮箱和密码
         * ========================================
         */

        const {
          data,
          error
        } =
          await supabaseClient.auth
            .signInWithPassword({
              email: email,
              password: password
            });



        /*
         * 登录失败
         */

        if (error) {

          console.error(
            "Supabase 登录错误：",
            error
          );


          showMessage(
            "登录错误：" + error.message,
            "error"
          );

          return;
        }



        /*
         * 没有取得用户
         */

        if (
          !data ||
          !data.user
        ) {

          showMessage(
            "登录失败：没有取得用户信息",
            "error"
          );

          return;
        }



        /*
         * ========================================
         * 第二步
         * 从 profiles 表读取当前用户权限
         * ========================================
         */

        const {
          data: profile,
          error: profileError
        } =
          await supabaseClient
            .from("profiles")
            .select(
              "id, name, role, company_name"
            )
            .eq(
              "id",
              data.user.id
            )
            .single();



        /*
         * profiles 查询失败
         */

        if (
          profileError ||
          !profile
        ) {

          console.error(
            "读取 profiles 错误：",
            profileError
          );


          await supabaseClient.auth
            .signOut();


          showMessage(
            "读取用户权限失败：" +
            (
              profileError
                ? profileError.message
                : "数据库中找不到该用户资料"
            ),
            "error"
          );

          return;
        }



        /*
         * ========================================
         * 第三步
         * 检查是不是 company 用户
         * ========================================
         */

        if (
          profile.role !==
          "company"
        ) {

          await supabaseClient.auth
            .signOut();


          showMessage(
            "该账号不是公司管理人员账号",
            "error"
          );

          return;
        }



        /*
         * ========================================
         * 第四步
         * 登录成功
         * ========================================
         */

        showMessage(
          "登录成功，正在进入管理系统……",
          "success"
        );



        /*
         * 跳转到公司管理后台
         */

        setTimeout(
          function() {

            window.location.href =
              "wholemanagement.html";

          },
          500
        );


      } catch (error) {


        /*
         * ========================================
         * 捕获真正的 JavaScript / 网络错误
         * ========================================
         */

        console.error(
          "系统错误：",
          error
        );


        showMessage(
          "系统错误：" +
          (
            error &&
            error.message
              ? error.message
              : String(error)
          ),
          "error"
        );


      } finally {


        /*
         * 恢复登录按钮
         */

        loginBtn.disabled =
          false;


        loginBtn.innerText =
          "登录系统";

      }

    }
  );



  /*
   * ========================================
   * 显示 / 隐藏密码
   * ========================================
   */

  function togglePassword() {

    const passwordInput =
      document.getElementById(
        "password"
      );


    const button =
      document.querySelector(
        ".show-password"
      );


    if (
      passwordInput.type ===
      "password"
    ) {

      passwordInput.type =
        "text";

      button.innerText =
        "隐藏";

    } else {

      passwordInput.type =
        "password";

      button.innerText =
        "显示";

    }

  }



  /*
   * ========================================
   * 页面提示信息
   * ========================================
   */

  function showMessage(
    text,
    type
  ) {

    message.innerText =
      text;


    if (type) {

      message.className =
        "message " + type;

    } else {

      message.className =
        "message";

    }

  }

</script>


</body>
</html>
