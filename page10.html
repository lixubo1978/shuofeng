<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    http-equiv="Cache-Control"
    content="no-store, no-cache, must-revalidate, max-age=0"
  >

  <meta
    http-equiv="Pragma"
    content="no-cache"
  >

  <meta
    http-equiv="Expires"
    content="0"
  >

  <title>管理人员登录｜硕丰科技</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;
      padding: 0;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Microsoft YaHei",
        Arial,
        sans-serif;

      background: #f4f6f8;

      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;
    }


    .login-container {
      width: 100%;
      max-width: 420px;

      background: #ffffff;

      padding: 42px 36px;

      border-radius: 14px;

      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.08);
    }


    .logo {
      text-align: center;
      margin-bottom: 10px;
    }


    .logo-title {
      font-size: 25px;
      font-weight: 700;
      color: #111827;
      letter-spacing: 1px;
    }


    .logo-subtitle {
      margin-top: 5px;
      font-size: 13px;
      color: #6b7280;
    }


    .login-title {
      margin-top: 30px;
      margin-bottom: 26px;

      text-align: center;

      font-size: 20px;
      font-weight: 600;

      color: #1f2937;
    }


    .form-group {
      margin-bottom: 20px;
    }


    label {
      display: block;

      margin-bottom: 8px;

      font-size: 14px;
      font-weight: 600;

      color: #374151;
    }


    input {
      width: 100%;

      padding: 12px 13px;

      border: 1px solid #d1d5db;

      border-radius: 8px;

      font-size: 15px;

      outline: none;

      background: #ffffff;

      transition:
        border-color 0.2s,
        box-shadow 0.2s;
    }


    input:focus {
      border-color: #2563eb;

      box-shadow:
        0 0 0 3px rgba(37, 99, 235, 0.10);
    }


    .login-button {
      width: 100%;

      margin-top: 8px;

      padding: 13px;

      border: none;

      border-radius: 8px;

      background: #0f172a;

      color: #ffffff;

      font-size: 15px;
      font-weight: 600;

      cursor: pointer;

      transition: 0.2s;
    }


    .login-button:hover {
      background: #1e293b;
    }


    .login-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }


    .home-button {
      width: 100%;

      margin-top: 12px;

      padding: 12px;

      border: 1px solid #d1d5db;

      border-radius: 8px;

      background: #ffffff;

      color: #374151;

      font-size: 14px;
      font-weight: 600;

      cursor: pointer;

      transition: 0.2s;
    }


    .home-button:hover {
      background: #f3f4f6;

      border-color: #9ca3af;
    }


    .message {
      min-height: 20px;

      margin-top: 16px;

      text-align: center;

      font-size: 13px;
      font-weight: 500;

      line-height: 1.6;
    }


    .message.error {
      color: #dc2626;
    }


    .message.success {
      color: #059669;
    }


    .security-note {
      margin-top: 26px;

      padding-top: 18px;

      border-top: 1px solid #e5e7eb;

      text-align: center;

      font-size: 12px;
      color: #9ca3af;

      line-height: 1.7;
    }


    @media (max-width: 520px) {

      body {
        padding: 18px;
      }

      .login-container {
        padding: 34px 24px;
      }

    }

  </style>

</head>



<body>


  <div class="login-container">


    <div class="logo">

      <div class="logo-title">
        硕丰科技
      </div>

      <div class="logo-subtitle">
        ShuoFeng Technology
      </div>

    </div>



    <div class="login-title">
      管理人员登录
    </div>



    <form
      id="loginForm"
      autocomplete="off"
    >


      <!-- 降低浏览器自动填充概率 -->

      <input
        type="text"
        autocomplete="username"
        tabindex="-1"
        aria-hidden="true"
        style="
          position:absolute;
          left:-10000px;
          top:-10000px;
          width:1px;
          height:1px;
          opacity:0;
        "
      >

      <input
        type="password"
        autocomplete="current-password"
        tabindex="-1"
        aria-hidden="true"
        style="
          position:absolute;
          left:-10000px;
          top:-10000px;
          width:1px;
          height:1px;
          opacity:0;
        "
      >



      <div class="form-group">

        <label for="username">
          用户名
        </label>

        <input
          id="username"
          name="management_login_username"
          type="text"

          autocomplete="off"
          autocorrect="off"
          autocapitalize="none"
          spellcheck="false"

          readonly
          required
        >

      </div>



      <div class="form-group">

        <label for="password">
          密码
        </label>

        <input
          id="password"
          name="management_login_password"
          type="password"

          autocomplete="new-password"

          readonly
          required
        >

      </div>



      <button
        id="loginButton"
        class="login-button"
        type="submit"
      >
        登录
      </button>


      <button
        class="home-button"
        type="button"
        onclick="goHome()"
      >
        ← 返回主页
      </button>



      <div
        id="message"
        class="message"
      ></div>


    </form>



    <div class="security-note">

      本入口仅限公司管理人员使用。
      <br>
      只有有效的 admin / founder 账号可以进入管理系统。
      <br>
      本页面不保存登录用户名和密码。

    </div>


  </div>



  <!-- Supabase JS -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>

    /* =====================================================
       Supabase 配置
    ===================================================== */

    const SUPABASE_URL =
      "https://icmifhjjhgjrhkunjbmu.supabase.co";


    const SUPABASE_KEY =
      "sb_publishable_PR-D5FTznDtffymRmANXqQ_a5qYXrI4";


    const sb =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true
          }
        }
      );


    const MANAGEMENT_PAGE =
      "wholemanagement.html";


    const usernameInput =
      document.getElementById(
        "username"
      );


    const passwordInput =
      document.getElementById(
        "password"
      );


    const loginForm =
      document.getElementById(
        "loginForm"
      );


    const loginButton =
      document.getElementById(
        "loginButton"
      );


    const message =
      document.getElementById(
        "message"
      );



    /* =====================================================
       返回主页
    ===================================================== */

    function goHome() {

      clearLoginFields();

      window.location.href =
        "index.html";

    }



    /* =====================================================
       清除旧前端登录数据

       不在这里清除 Supabase Session。
    ===================================================== */

    function clearOldLocalData() {

      const keys = [
        "managementLogin",
        "managementUser",
        "managementRole",
        "loginTime",
        "username",
        "password"
      ];


      keys.forEach(
        function(key) {

          try {

            localStorage.removeItem(
              key
            );

          }

          catch (error) {}


          try {

            sessionStorage.removeItem(
              key
            );

          }

          catch (error) {}

        }
      );

    }



    /* =====================================================
       清空用户名密码
    ===================================================== */

    function clearLoginFields() {

      usernameInput.value =
        "";

      passwordInput.value =
        "";

    }



    /* =====================================================
       页面打开
    ===================================================== */

    document.addEventListener(
      "DOMContentLoaded",

      function() {


        clearOldLocalData();

        clearLoginFields();


        setTimeout(
          function() {


            usernameInput.removeAttribute(
              "readonly"
            );


            passwordInput.removeAttribute(
              "readonly"
            );


            clearLoginFields();


            usernameInput.focus();


          },
          350
        );


        setTimeout(
          function() {

            clearLoginFields();

          },
          800
        );


      }
    );



    /* =====================================================
       浏览器后退到登录页面
    ===================================================== */

    window.addEventListener(
      "pageshow",

      function() {


        clearOldLocalData();


        setTimeout(
          function() {

            clearLoginFields();

          },
          100
        );


      }
    );



    /* =====================================================
       检查当前账号是否属于公司管理人员

       允许：
       founder
       admin

       禁止：
       agent
       其他角色
       无 profile
       is_active=false
    ===================================================== */

    async function verifyManagementProfile(
      user
    ) {


      if (
        !user ||
        !user.id
      ) {

        throw new Error(
          "无法读取当前登录用户。"
        );

      }



      /*
        最多读取3次，
        对刚刚创建的管理账号更稳妥。
      */

      let profile =
        null;


      let lastError =
        null;



      for (
        let attempt = 1;
        attempt <= 3;
        attempt++
      ) {


        const {
          data,
          error
        } =
          await sb
            .from(
              "profiles"
            )
            .select(
              "id, display_name, role, is_active"
            )
            .eq(
              "id",
              user.id
            )
            .maybeSingle();



        if (
          !error &&
          data
        ) {


          profile =
            data;


          lastError =
            null;


          break;

        }



        lastError =
          error;



        if (
          attempt < 3
        ) {


          await new Promise(
            resolve =>
              setTimeout(
                resolve,
                300
              )
          );


        }


      }



      /*
        没有 profiles
      */

      if (
        !profile
      ) {


        console.error(
          "没有找到 profiles：",
          lastError
        );


        throw new Error(
          "该账号没有公司管理人员资料，禁止进入管理系统。"
        );

      }



      /*
        账号被停用
      */

      if (
        profile.is_active !== true
      ) {


        throw new Error(
          "该账号已经停用，禁止进入管理系统。"
        );

      }



      /*
        核心权限判断

        只有 founder / admin 可以进入。
      */

      const allowed =
        profile.role ===
        "founder"
        ||
        profile.role ===
        "admin";



      if (
        !allowed
      ) {


        console.warn(
          "非管理人员尝试从 page10 登录：",
          {
            userId:
              user.id,

            role:
              profile.role
          }
        );


        throw new Error(
          "该账号不是公司管理人员，禁止进入管理系统。"
        );

      }



      return profile;

    }



    /* =====================================================
       登录
    ===================================================== */

    loginForm.addEventListener(
      "submit",

      async function(event) {


        event.preventDefault();



        const email =
          usernameInput
            .value
            .trim();



        const password =
          passwordInput.value;



        message.textContent =
          "";


        message.className =
          "message";



        if (
          !email
        ) {


          message.textContent =
            "请输入用户名。";


          message.className =
            "message error";


          usernameInput.focus();


          return;

        }



        if (
          !password
        ) {


          message.textContent =
            "请输入密码。";


          message.className =
            "message error";


          passwordInput.focus();


          return;

        }



        loginButton.disabled =
          true;


        loginButton.textContent =
          "正在验证身份...";



        try {


          /*
            =================================================
            第一级：
            Supabase Auth 验证邮箱和密码
            =================================================
          */

          const {
            data,
            error
          } =
            await sb
              .auth
              .signInWithPassword({

                email:
                  email,

                password:
                  password

              });



          if (
            error
          ) {

            throw error;

          }



          if (
            !data ||
            !data.user ||
            !data.session
          ) {


            throw new Error(
              "登录失败，请重新输入。"
            );

          }



          /*
            =================================================
            第二级：
            profiles 权限检查
            =================================================
          */

          loginButton.textContent =
            "正在检查管理权限...";



          let profile;


          try {


            profile =
              await verifyManagementProfile(
                data.user
              );


          }

          catch (
            permissionError
          ) {


            /*
              非管理账号虽然 Auth 已经登录成功，
              这里必须立即注销。

              这样 agent 不会留下有效 Session。
            */

            try {


              await sb
                .auth
                .signOut();


            }

            catch (
              signOutError
            ) {


              console.error(
                "拒绝登录后退出 Session 失败：",
                signOutError
              );


            }



            throw permissionError;

          }



          /*
            到这里说明同时满足：

            1. 邮箱密码正确
            2. profiles 存在
            3. is_active=true
            4. role=founder/admin
          */


          clearLoginFields();


          clearOldLocalData();



          message.textContent =
            (
              profile.display_name
              ?
              profile.display_name +
              "，"
              :
              ""
            )
            +
            "管理身份验证成功，正在进入管理中心...";


          message.className =
            "message success";



          /*
            使用 replace，
            防止通过浏览器返回直接回到登录后的页面状态。
          */

          setTimeout(
            function() {


              window.location.replace(
                MANAGEMENT_PAGE
              );


            },
            200
          );


        }


        catch (error) {


          passwordInput.value =
            "";



          let errorMessage =
            "用户名或密码错误。";



          if (
            error &&
            error.message
          ) {


            const rawMessage =
              error.message;


            const msg =
              rawMessage.toLowerCase();



            if (
              msg.includes(
                "invalid login credentials"
              )
            ) {


              errorMessage =
                "用户名或密码错误。";


            }


            else if (
              msg.includes(
                "email not confirmed"
              )
            ) {


              errorMessage =
                "该账号尚未完成邮箱确认。";


            }


            else if (
              msg.includes(
                "failed to fetch"
              )
            ) {


              errorMessage =
                "无法连接 Supabase，请检查网络连接。";


            }


            else if (
              msg.includes(
                "不是公司管理人员"
              )
              ||
              msg.includes(
                "没有公司管理人员资料"
              )
              ||
              msg.includes(
                "已经停用"
              )
            ) {


              errorMessage =
                rawMessage;


            }


            else {


              errorMessage =
                rawMessage;


            }


          }



          message.textContent =
            errorMessage;


          message.className =
            "message error";


          passwordInput.focus();


        }


        finally {


          loginButton.disabled =
            false;


          loginButton.textContent =
            "登录";


        }


      }
    );



    /* =====================================================
       密码禁止复制
    ===================================================== */

    passwordInput.addEventListener(
      "copy",

      function(event) {

        event.preventDefault();

      }
    );


    passwordInput.addEventListener(
      "cut",

      function(event) {

        event.preventDefault();

      }
    );



    /* =====================================================
       离开登录页时清空输入框
    ===================================================== */

    window.addEventListener(
      "pagehide",

      function() {

        clearLoginFields();

      }
    );


    window.addEventListener(
      "beforeunload",

      function() {

        clearLoginFields();

      }
    );

  </script>


</body>

</html>
