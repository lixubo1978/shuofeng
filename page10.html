<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>管理人员登录｜硕丰科技</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Microsoft YaHei",
        Arial,
        sans-serif;

      background: #f4f6f8;

      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-container {
      width: 100%;
      max-width: 420px;

      background: #ffffff;

      padding: 42px 36px;

      border-radius: 14px;

      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.08);
    }

    .logo {
      text-align: center;
      margin-bottom: 6px;
    }

    .logo-title {
      margin: 0;

      color: #0b1220;

      font-size: 26px;
      font-weight: 700;

      letter-spacing: 1px;
    }

    .system-name {
      margin-top: 6px;

      color: #888;

      font-size: 14px;
    }

    .login-title {
      margin-top: 32px;
      margin-bottom: 28px;

      text-align: center;

      color: #222;

      font-size: 20px;
      font-weight: 700;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;

      margin-bottom: 8px;

      color: #333;

      font-size: 14px;
      font-weight: 600;
    }

    .input-wrap {
      position: relative;
    }

    .form-input {
      width: 100%;
      height: 46px;

      padding: 0 14px;

      border: 1px solid #d8dee8;
      border-radius: 8px;

      background: #eef4ff;

      color: #222;

      font-size: 14px;

      outline: none;

      transition:
        border-color 0.2s,
        box-shadow 0.2s;
    }

    .form-input:focus {
      border-color: #7da2d6;

      box-shadow:
        0 0 0 3px rgba(64, 115, 180, 0.12);
    }

    .password-input {
      padding-right: 64px;
    }

    .show-password {
      position: absolute;

      top: 50%;
      right: 14px;

      transform: translateY(-50%);

      border: none;
      background: transparent;

      color: #666;

      font-size: 13px;

      cursor: pointer;
    }

    .login-button {
      width: 100%;
      height: 48px;

      margin-top: 2px;

      border: none;
      border-radius: 8px;

      background: #071124;

      color: #ffffff;

      font-size: 15px;
      font-weight: 700;

      cursor: pointer;

      transition:
        opacity 0.2s,
        transform 0.1s;
    }

    .login-button:hover {
      opacity: 0.94;
    }

    .login-button:active {
      transform: translateY(1px);
    }

    .login-button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .back-button {
      width: 100%;
      height: 46px;

      margin-top: 12px;

      border: 1px solid #d8dee8;
      border-radius: 8px;

      background: #ffffff;

      color: #333;

      font-size: 14px;
      font-weight: 500;

      cursor: pointer;
    }

    .message {
      display: none;

      margin-top: 16px;

      padding: 10px 12px;

      border-radius: 7px;

      font-size: 13px;
      line-height: 1.6;

      text-align: center;
    }

    .message.error {
      display: block;

      background: #fff1f1;

      color: #d93025;

      border: 1px solid #ffd5d5;
    }

    .message.success {
      display: block;

      background: #effaf2;

      color: #1f7a3f;

      border: 1px solid #cfeeda;
    }

    .security-note {
      margin-top: 18px;

      padding: 12px 14px;

      border-radius: 8px;

      background: #f7f8fa;

      color: #777;

      font-size: 12px;
      line-height: 1.7;
    }

    .copyright {
      margin-top: 26px;

      text-align: center;

      color: #aaa;

      font-size: 12px;
    }

    @media (max-width: 520px) {
      body {
        align-items: flex-start;

        padding: 30px 16px;
      }

      .login-container {
        margin-top: 30px;

        padding: 34px 24px;
      }
    }
  </style>
</head>

<body>

  <div class="login-container">

    <div class="logo">
      <h1 class="logo-title">硕丰科技</h1>
      <div class="system-name">企业管理系统</div>
    </div>

    <div class="login-title">
      管理人员登录
    </div>

    <form id="loginForm">

      <div class="form-group">

        <label
          class="form-label"
          for="email"
        >
          邮箱
        </label>

        <input
          id="email"
          class="form-input"
          type="email"
          autocomplete="username"
          placeholder="请输入邮箱"
          required
        >

      </div>


      <div class="form-group">

        <label
          class="form-label"
          for="password"
        >
          密码
        </label>

        <div class="input-wrap">

          <input
            id="password"
            class="form-input password-input"
            type="password"
            autocomplete="current-password"
            placeholder="请输入密码"
            required
          >

          <button
            id="togglePassword"
            class="show-password"
            type="button"
          >
            显示
          </button>

        </div>

      </div>


      <button
        id="loginButton"
        class="login-button"
        type="submit"
      >
        登录系统
      </button>


      <button
        class="back-button"
        type="button"
        onclick="window.location.href='/'"
      >
        返回首页
      </button>


      <div
        id="message"
        class="message"
      ></div>


      <div class="security-note">
        本页面仅供公司授权管理人员使用。
        用户身份由 Supabase Auth 验证，
        系统权限由数据库统一验证。
      </div>

    </form>


    <div class="copyright">
      © 2026 硕丰科技
    </div>

  </div>


  <script>
    // =========================================================
    // Supabase 配置
    // =========================================================

    const SUPABASE_URL = '你的Supabase项目URL';

    const SUPABASE_ANON_KEY = '你的Supabase anon key';


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );


    // =========================================================
    // DOM
    // =========================================================

    const loginForm =
      document.getElementById('loginForm');

    const emailInput =
      document.getElementById('email');

    const passwordInput =
      document.getElementById('password');

    const togglePassword =
      document.getElementById('togglePassword');

    const loginButton =
      document.getElementById('loginButton');

    const messageBox =
      document.getElementById('message');


    // =========================================================
    // 提示信息
    // =========================================================

    function showMessage(text, type = 'error') {

      messageBox.textContent = text;

      messageBox.className =
        'message ' + type;
    }


    function clearMessage() {

      messageBox.textContent = '';

      messageBox.className =
        'message';
    }


    // =========================================================
    // 显示 / 隐藏密码
    // =========================================================

    togglePassword.addEventListener(
      'click',
      function () {

        const isPassword =
          passwordInput.type === 'password';

        passwordInput.type =
          isPassword
            ? 'text'
            : 'password';

        togglePassword.textContent =
          isPassword
            ? '隐藏'
            : '显示';
      }
    );


    // =========================================================
    // 登录
    // =========================================================

    loginForm.addEventListener(
      'submit',
      async function (event) {

        event.preventDefault();

        clearMessage();


        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;


        if (!email || !password) {

          showMessage(
            '请输入邮箱和密码。'
          );

          return;
        }


        loginButton.disabled = true;

        loginButton.textContent =
          '正在登录...';


        try {

          // ===================================================
          // 1. Supabase Auth 登录
          // ===================================================

          const {
            data: authData,
            error: authError
          } =
            await supabaseClient.auth
              .signInWithPassword({
                email: email,
                password: password
              });


          if (authError) {

            console.error(
              'Auth error:',
              authError
            );

            showMessage(
              '登录失败，请检查邮箱或密码。'
            );

            return;
          }


          if (
            !authData ||
            !authData.user
          ) {

            showMessage(
              '登录失败，没有读取到用户信息。'
            );

            return;
          }


          const user =
            authData.user;


          // ===================================================
          // 2. 读取 profiles
          //
          // 注意：
          // V1.0 正式字段是：
          //
          // display_name
          // role
          // is_active
          // ===================================================

          const {
            data: profile,
            error: profileError
          } =
            await supabaseClient
              .from('profiles')
              .select(
                'id, display_name, role, is_active'
              )
              .eq(
                'id',
                user.id
              )
              .single();


          if (profileError) {

            console.error(
              'Profile error:',
              profileError
            );


            await supabaseClient.auth
              .signOut();


            showMessage(
              '读取用户权限失败：'
              + profileError.message
            );

            return;
          }


          if (!profile) {

            await supabaseClient.auth
              .signOut();


            showMessage(
              '该账号尚未配置系统权限。'
            );

            return;
          }


          // ===================================================
          // 3. 判断账号是否有效
          // ===================================================

          if (profile.is_active !== true) {

            await supabaseClient.auth
              .signOut();


            showMessage(
              '该账号目前已被停用。'
            );

            return;
          }


          // ===================================================
          // 4. 管理人员登录页只允许：
          //
          // founder
          // admin
          // ===================================================

          if (
            profile.role !== 'founder'
            &&
            profile.role !== 'admin'
          ) {

            await supabaseClient.auth
              .signOut();


            showMessage(
              '该账号不是管理人员账号，无法从此入口登录。'
            );

            return;
          }


          // ===================================================
          // 5. 保存前端显示信息
          //
          // 注意：
          // 真正权限仍然由 Supabase RLS 控制，
          // 这里不能作为安全权限判断依据。
          // ===================================================

          sessionStorage.setItem(
            'sf_user_id',
            user.id
          );

          sessionStorage.setItem(
            'sf_display_name',
            profile.display_name || ''
          );

          sessionStorage.setItem(
            'sf_role',
            profile.role
          );


          showMessage(
            '登录成功，正在进入管理系统...',
            'success'
          );


          // ===================================================
          // 6. 跳转管理主页
          // ===================================================

          setTimeout(
            function () {

              window.location.href =
                '/wholemanagement';

            },
            300
          );


        } catch (error) {

          console.error(
            'Login exception:',
            error
          );


          showMessage(
            '系统连接失败，请稍后重试。'
          );


        } finally {

          loginButton.disabled =
            false;

          loginButton.textContent =
            '登录系统';
        }

      }
    );


    // =========================================================
    // 页面加载时：
    // 如果已有 Supabase Session，
    // 检查是否已经是管理人员
    // =========================================================

    async function checkExistingSession() {

      try {

        const {
          data: sessionData,
          error: sessionError
        } =
          await supabaseClient.auth
            .getSession();


        if (
          sessionError ||
          !sessionData ||
          !sessionData.session
        ) {

          return;
        }


        const user =
          sessionData.session.user;


        const {
          data: profile,
          error: profileError
        } =
          await supabaseClient
            .from('profiles')
            .select(
              'display_name, role, is_active'
            )
            .eq(
              'id',
              user.id
            )
            .single();


        if (
          profileError ||
          !profile
        ) {

          return;
        }


        if (
          profile.is_active === true
          &&
          (
            profile.role === 'founder'
            ||
            profile.role === 'admin'
          )
        ) {

          sessionStorage.setItem(
            'sf_user_id',
            user.id
          );

          sessionStorage.setItem(
            'sf_display_name',
            profile.display_name || ''
          );

          sessionStorage.setItem(
            'sf_role',
            profile.role
          );


          window.location.href =
            '/wholemanagement';
        }


      } catch (error) {

        console.error(
          'Session check error:',
          error
        );

      }

    }


    checkExistingSession();

  </script>

</body>
</html>
