<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>管理人员登录｜硕丰科技</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #f4f6f8;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Microsoft YaHei",
        Arial,
        sans-serif;

      color: #111827;
    }

    .login-container {
      width: 100%;
      max-width: 420px;

      padding: 42px 36px;

      background: #ffffff;

      border-radius: 14px;

      box-shadow:
        0 10px 30px rgba(0,0,0,0.08);
    }

    .logo {
      text-align: center;
    }

    .logo-title {
      margin: 0;

      font-size: 26px;
      font-weight: 700;

      color: #071124;
    }

    .system-name {
      margin-top: 7px;

      font-size: 13px;

      color: #888;
    }

    .login-title {
      margin-top: 30px;
      margin-bottom: 28px;

      text-align: center;

      font-size: 20px;
      font-weight: 700;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;

      margin-bottom: 8px;

      font-size: 14px;
      font-weight: 600;
    }

    .input-wrap {
      position: relative;
    }

    .form-input {
      width: 100%;
      height: 46px;

      padding: 0 14px;

      border: 1px solid #d8dee8;
      border-radius: 8px;

      background: #eef4ff;

      font-size: 14px;

      outline: none;
    }

    .form-input:focus {
      border-color: #7da2d6;

      box-shadow:
        0 0 0 3px rgba(64,115,180,0.12);
    }

    .password-input {
      padding-right: 65px;
    }

    .show-password {
      position: absolute;

      right: 14px;
      top: 50%;

      transform: translateY(-50%);

      border: none;
      background: transparent;

      color: #666;

      cursor: pointer;
    }

    .login-button {
      width: 100%;
      height: 48px;

      border: none;
      border-radius: 8px;

      background: #071124;
      color: white;

      font-size: 15px;
      font-weight: 700;

      cursor: pointer;
    }

    .login-button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .back-button {
      width: 100%;
      height: 46px;

      margin-top: 12px;

      border: 1px solid #d8dee8;
      border-radius: 8px;

      background: white;

      color: #333;

      cursor: pointer;
    }

    .message {
      display: none;

      margin-top: 16px;

      padding: 10px 12px;

      border-radius: 7px;

      text-align: center;

      font-size: 13px;
      line-height: 1.6;
    }

    .message.error {
      display: block;

      background: #fff1f1;
      border: 1px solid #ffd5d5;

      color: #d93025;
    }

    .message.success {
      display: block;

      background: #effaf2;
      border: 1px solid #cfeeda;

      color: #1f7a3f;
    }

    .security-note {
      margin-top: 18px;

      padding: 12px 14px;

      border-radius: 8px;

      background: #f7f8fa;

      color: #777;

      font-size: 12px;
      line-height: 1.7;
    }

    .copyright {
      margin-top: 26px;

      text-align: center;

      color: #aaa;

      font-size: 12px;
    }

    @media (max-width: 520px) {
      body {
        align-items: flex-start;

        padding: 30px 16px;
      }

      .login-container {
        margin-top: 30px;

        padding: 34px 24px;
      }
    }
  </style>
</head>

<body>

<div class="login-container">

  <div class="logo">

    <h1 class="logo-title">
      硕丰科技
    </h1>

    <div class="system-name">
      企业管理系统
    </div>

  </div>


  <div class="login-title">
    管理人员登录
  </div>


  <form id="loginForm">

    <div class="form-group">

      <label
        class="form-label"
        for="email"
      >
        邮箱
      </label>

      <input
        id="email"
        class="form-input"
        type="email"
        autocomplete="username"
        placeholder="请输入邮箱"
        required
      >

    </div>


    <div class="form-group">

      <label
        class="form-label"
        for="password"
      >
        密码
      </label>

      <div class="input-wrap">

        <input
          id="password"
          class="form-input password-input"
          type="password"
          autocomplete="current-password"
          placeholder="请输入密码"
          required
        >

        <button
          id="togglePassword"
          class="show-password"
          type="button"
        >
          显示
        </button>

      </div>

    </div>


    <button
      id="loginButton"
      class="login-button"
      type="submit"
    >
      登录系统
    </button>


    <button
      class="back-button"
      type="button"
      onclick="window.location.href='/'"
    >
      返回首页
    </button>


    <div
      id="message"
      class="message"
    ></div>


    <div class="security-note">

      本页面仅供公司授权管理人员使用。

      用户登录由 Supabase Authentication 验证，
      管理权限由数据库 profiles 表及 RLS 统一控制。

    </div>

  </form>


  <div class="copyright">
    © 2026 硕丰科技
  </div>

</div>


<script>

/* ============================================================
   Supabase 正式配置
============================================================ */

const SUPABASE_URL =
  'https://icmifhjjhgjrhkunjbmu.supabase.co';


/*
  ↓↓↓ 这里只需要你自己粘贴完整 Publishable key ↓↓↓

  Settings
  → API Keys
  → Publishable key
  → Copy

  格式类似：
  sb_publishable_....................

  不要使用：
  sb_secret_
  service_role
*/

const SUPABASE_ANON_KEY =
  '这里粘贴完整的sb_publishable_key';


/* ============================================================
   Supabase Client
============================================================ */

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* ============================================================
   页面元素
============================================================ */

const loginForm =
  document.getElementById('loginForm');

const emailInput =
  document.getElementById('email');

const passwordInput =
  document.getElementById('password');

const togglePassword =
  document.getElementById('togglePassword');

const loginButton =
  document.getElementById('loginButton');

const messageBox =
  document.getElementById('message');


/* ============================================================
   信息提示
============================================================ */

function showMessage(
  text,
  type = 'error'
) {

  messageBox.textContent =
    text;

  messageBox.className =
    'message ' + type;

}


function clearMessage() {

  messageBox.textContent =
    '';

  messageBox.className =
    'message';

}


/* ============================================================
   密码显示 / 隐藏
============================================================ */

togglePassword.addEventListener(
  'click',
  function () {

    if (
      passwordInput.type === 'password'
    ) {

      passwordInput.type =
        'text';

      togglePassword.textContent =
        '隐藏';

    } else {

      passwordInput.type =
        'password';

      togglePassword.textContent =
        '显示';

    }

  }
);


/* ============================================================
   登录
============================================================ */

loginForm.addEventListener(
  'submit',
  async function (event) {

    event.preventDefault();

    clearMessage();


    const email =
      emailInput.value.trim();

    const password =
      passwordInput.value;


    if (
      !email ||
      !password
    ) {

      showMessage(
        '请输入邮箱和密码。'
      );

      return;

    }


    loginButton.disabled =
      true;

    loginButton.textContent =
      '正在登录...';


    try {

      /* ==============================
         1. Authentication 验证
      ============================== */

      const {
        data: authData,
        error: authError
      } =
        await supabaseClient.auth
          .signInWithPassword({

            email:
              email,

            password:
              password

          });


      if (authError) {

        console.error(
          authError
        );

        showMessage(
          '登录失败，请检查邮箱或密码。'
        );

        return;

      }


      if (
        !authData ||
        !authData.user
      ) {

        showMessage(
          '登录失败，没有取得用户信息。'
        );

        return;

      }


      const user =
        authData.user;


      /* ==============================
         2. 查询 profiles
      ============================== */

      const {
        data: profile,
        error: profileError
      } =
        await supabaseClient

          .from('profiles')

          .select(
            'id, display_name, role, is_active'
          )

          .eq(
            'id',
            user.id
          )

          .single();


      if (profileError) {

        console.error(
          profileError
        );

        await supabaseClient.auth
          .signOut();

        showMessage(
          '读取用户权限失败：' +
          profileError.message
        );

        return;

      }


      if (!profile) {

        await supabaseClient.auth
          .signOut();

        showMessage(
          '该账号尚未配置管理权限。'
        );

        return;

      }


      /* ==============================
         3. 是否有效
      ============================== */

      if (
        profile.is_active !== true
      ) {

        await supabaseClient.auth
          .signOut();

        showMessage(
          '该账号目前已停用。'
        );

        return;

      }


      /* ==============================
         4. 是否管理人员
      ============================== */

      if (
        profile.role !== 'founder'
        &&
        profile.role !== 'admin'
      ) {

        await supabaseClient.auth
          .signOut();

        showMessage(
          '该账号不是公司管理人员账号。'
        );

        return;

      }


      /* ==============================
         5. 保存页面显示资料
      ============================== */

      sessionStorage.setItem(
        'sf_user_id',
        user.id
      );

      sessionStorage.setItem(
        'sf_display_name',
        profile.display_name || ''
      );

      sessionStorage.setItem(
        'sf_role',
        profile.role
      );


      /* ==============================
         6. 登录成功
      ============================== */

      showMessage(
        '登录成功，正在进入公司管理后台...',
        'success'
      );


      setTimeout(
        function () {

          window.location.href =
            'wholemanagement.html';

        },
        300
      );


    } catch (error) {

      console.error(
        error
      );

      showMessage(
        '系统连接失败，请稍后重新登录。'
      );

    } finally {

      loginButton.disabled =
        false;

      loginButton.textContent =
        '登录系统';

    }

  }
);


/* ============================================================
   page10 始终显示登录页面
============================================================ */

emailInput.focus();

</script>

</body>
</html>
