<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    http-equiv="Cache-Control"
    content="no-store, no-cache, must-revalidate, max-age=0"
  >

  <meta
    http-equiv="Pragma"
    content="no-cache"
  >

  <meta
    http-equiv="Expires"
    content="0"
  >

  <title>管理人员登录｜硕丰科技</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;
      padding: 0;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Microsoft YaHei",
        Arial,
        sans-serif;

      background: #f4f6f8;

      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;
    }


    .login-container {
      width: 100%;
      max-width: 420px;

      background: #ffffff;

      padding: 42px 36px;

      border-radius: 14px;

      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.08);
    }


    .logo {
      text-align: center;
      margin-bottom: 10px;
    }


    .logo-title {
      font-size: 25px;
      font-weight: 700;
      color: #111827;
      letter-spacing: 1px;
    }


    .logo-subtitle {
      margin-top: 5px;
      font-size: 13px;
      color: #6b7280;
    }


    .login-title {
      margin-top: 30px;
      margin-bottom: 26px;

      text-align: center;

      font-size: 20px;
      font-weight: 600;

      color: #1f2937;
    }


    .form-group {
      margin-bottom: 20px;
    }


    label {
      display: block;

      margin-bottom: 8px;

      font-size: 14px;
      font-weight: 600;

      color: #374151;
    }


    input {
      width: 100%;

      padding: 12px 13px;

      border: 1px solid #d1d5db;

      border-radius: 8px;

      font-size: 15px;

      outline: none;

      background: #ffffff;

      transition:
        border-color 0.2s,
        box-shadow 0.2s;
    }


    input:focus {
      border-color: #2563eb;

      box-shadow:
        0 0 0 3px rgba(37, 99, 235, 0.10);
    }


    .login-button {
      width: 100%;

      margin-top: 8px;

      padding: 13px;

      border: none;

      border-radius: 8px;

      background: #0f172a;

      color: #ffffff;

      font-size: 15px;
      font-weight: 600;

      cursor: pointer;

      transition: 0.2s;
    }


    .login-button:hover {
      background: #1e293b;
    }


    .login-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }


    .message {
      min-height: 20px;

      margin-top: 16px;

      text-align: center;

      font-size: 13px;
      font-weight: 500;

      line-height: 1.5;
    }


    .message.error {
      color: #dc2626;
    }


    .message.success {
      color: #059669;
    }


    .security-note {
      margin-top: 26px;

      padding-top: 18px;

      border-top: 1px solid #e5e7eb;

      text-align: center;

      font-size: 12px;
      color: #9ca3af;

      line-height: 1.7;
    }


    @media (max-width: 520px) {

      body {
        padding: 18px;
      }

      .login-container {
        padding: 34px 24px;
      }

    }

  </style>

</head>



<body>


  <div class="login-container">


    <div class="logo">

      <div class="logo-title">
        硕丰科技
      </div>

      <div class="logo-subtitle">
        ShuoFeng Technology
      </div>

    </div>



    <div class="login-title">
      管理人员登录
    </div>



    <form
      id="loginForm"
      autocomplete="off"
    >


      <!-- 降低浏览器自动填充概率 -->

      <input
        type="text"
        autocomplete="username"
        tabindex="-1"
        aria-hidden="true"
        style="
          position:absolute;
          left:-10000px;
          top:-10000px;
          width:1px;
          height:1px;
          opacity:0;
        "
      >

      <input
        type="password"
        autocomplete="current-password"
        tabindex="-1"
        aria-hidden="true"
        style="
          position:absolute;
          left:-10000px;
          top:-10000px;
          width:1px;
          height:1px;
          opacity:0;
        "
      >



      <div class="form-group">

        <label for="username">
          用户名
        </label>

        <input
          id="username"
          name="management_login_username"
          type="text"

          autocomplete="off"
          autocorrect="off"
          autocapitalize="none"
          spellcheck="false"

          readonly
          required
        >

      </div>



      <div class="form-group">

        <label for="password">
          密码
        </label>

        <input
          id="password"
          name="management_login_password"
          type="password"

          autocomplete="new-password"

          readonly
          required
        >

      </div>



      <button
        id="loginButton"
        class="login-button"
        type="submit"
      >
        登录
      </button>



      <div
        id="message"
        class="message"
      ></div>


    </form>



    <div class="security-note">

      为保护管理系统安全，本页面不保存登录用户名和密码。
      <br>
      每次进入管理系统均需重新手动输入。

    </div>


  </div>



  <!-- Supabase JS -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>

    /* =====================================================
       Supabase 配置
    ===================================================== */

    const SUPABASE_URL =
      "https://icmifhjihgjrhkunjbmu.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_PR-D5FTznDtffymRmANXqQ_a5qYXrI4";


    const sb =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true
          }
        }
      );


    const MANAGEMENT_PAGE =
      "wholemanagement.html";


    const usernameInput =
      document.getElementById("username");

    const passwordInput =
      document.getElementById("password");

    const loginForm =
      document.getElementById("loginForm");

    const loginButton =
      document.getElementById("loginButton");

    const message =
      document.getElementById("message");



    /* =====================================================
       清除前端旧登录资料
       注意：不清除 Supabase Session
    ===================================================== */

    function clearOldLocalData() {

      const keys = [
        "managementLogin",
        "managementUser",
        "managementRole",
        "loginTime",
        "username",
        "password"
      ];

      keys.forEach(function(key) {

        try {
          localStorage.removeItem(key);
        } catch (error) {}

        try {
          sessionStorage.removeItem(key);
        } catch (error) {}

      });

    }



    /* =====================================================
       清空用户名密码输入框
    ===================================================== */

    function clearLoginFields() {

      usernameInput.value = "";
      passwordInput.value = "";

    }



    /* =====================================================
       页面打开时
    ===================================================== */

    document.addEventListener(
      "DOMContentLoaded",
      function() {

        clearOldLocalData();
        clearLoginFields();

        setTimeout(
          function() {

            usernameInput.removeAttribute(
              "readonly"
            );

            passwordInput.removeAttribute(
              "readonly"
            );

            clearLoginFields();

            usernameInput.focus();

          },
          350
        );

        setTimeout(
          function() {

            clearLoginFields();

          },
          800
        );

      }
    );



    /* =====================================================
       浏览器后退回登录页
    ===================================================== */

    window.addEventListener(
      "pageshow",
      function() {

        clearOldLocalData();

        setTimeout(
          function() {

            clearLoginFields();

          },
          100
        );

      }
    );



    /* =====================================================
       登录
    ===================================================== */

    loginForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const email =
          usernameInput.value.trim();

        const password =
          passwordInput.value;


        message.textContent = "";
        message.className = "message";


        if (!email) {

          message.textContent =
            "请输入用户名。";

          message.className =
            "message error";

          usernameInput.focus();

          return;
        }


        if (!password) {

          message.textContent =
            "请输入密码。";

          message.className =
            "message error";

          passwordInput.focus();

          return;
        }


        loginButton.disabled = true;

        loginButton.textContent =
          "正在登录...";


        try {

          /*
            Supabase Auth
            邮箱 + 密码登录
          */

          const {
            data,
            error
          } =
            await sb.auth.signInWithPassword({
              email: email,
              password: password
            });


          if (error) {

            throw error;

          }


          if (
            !data ||
            !data.user ||
            !data.session
          ) {

            throw new Error(
              "登录失败，请重新输入。"
            );

          }


          /*
            登录成功后不保存用户名或密码
          */

          usernameInput.value = "";
          passwordInput.value = "";

          clearOldLocalData();


          message.textContent =
            "登录成功，正在进入管理中心...";

          message.className =
            "message success";


          setTimeout(
            function() {

              window.location.replace(
                MANAGEMENT_PAGE
              );

            },
            200
          );

        }


        catch (error) {

          passwordInput.value = "";


          let errorMessage =
            "用户名或密码错误。";


          if (error && error.message) {

            const msg =
              error.message.toLowerCase();


            if (
              msg.includes("invalid login credentials")
            ) {

              errorMessage =
                "用户名或密码错误。";

            }

            else if (
              msg.includes("email not confirmed")
            ) {

              errorMessage =
                "该账号尚未完成邮箱确认。";

            }

            else if (
              msg.includes("failed to fetch")
            ) {

              errorMessage =
                "无法连接 Supabase，请检查网络连接。";

            }

            else {

              errorMessage =
                error.message;

            }

          }


          message.textContent =
            errorMessage;

          message.className =
            "message error";


          passwordInput.focus();

        }


        finally {

          loginButton.disabled = false;

          loginButton.textContent =
            "登录";

        }

      }
    );



    /* =====================================================
       密码禁止复制
    ===================================================== */

    passwordInput.addEventListener(
      "copy",
      function(event) {

        event.preventDefault();

      }
    );


    passwordInput.addEventListener(
      "cut",
      function(event) {

        event.preventDefault();

      }
    );



    /* =====================================================
       离开登录页时清空输入框
    ===================================================== */

    window.addEventListener(
      "pagehide",
      function() {

        usernameInput.value = "";
        passwordInput.value = "";

      }
    );


    window.addEventListener(
      "beforeunload",
      function() {

        usernameInput.value = "";
        passwordInput.value = "";

      }
    );

  </script>


</body>

</html>
