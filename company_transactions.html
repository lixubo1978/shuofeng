<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>公司流水｜硕丰科技</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}html{visibility:hidden}html.ready{visibility:visible}body{margin:0;background:#f4f6f8;font:14px -apple-system,"Microsoft YaHei",sans-serif;color:#1f2937}header{background:#0f172a;color:white;padding:20px;display:flex;justify-content:space-between}main{max-width:1350px;margin:auto;padding:24px}section{background:white;border:1px solid #e5e7eb;border-radius:10px;padding:18px;margin:14px 0}button,input,select,textarea{font:inherit;padding:9px;border:1px solid #cbd5e1;border-radius:6px}button{cursor:pointer}.blue{background:#2563eb;color:white}.flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.filters{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:15px 0}.filters label,.form label{display:block;font-size:12px;color:#64748b}.filters input,.filters select,.form input,.form select,.form textarea{width:100%}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stats section{margin-top:0}.stats b{display:block;font-size:26px;margin-top:8px}.green{color:#15803d}.red{color:#dc2626}.table{overflow:auto}table{width:100%;min-width:1200px;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #eee;text-align:left;font-size:12px}th{background:#f8fafc}.void{color:#94a3b8}.mask{display:none;position:fixed;inset:0;background:#0009;align-items:center;justify-content:center}.mask.show{display:flex}.modal{background:white;width:min(720px,95vw);padding:20px;border-radius:10px;max-height:95vh;overflow:auto}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.wide{grid-column:1/-1}.warn{position:fixed;bottom:20px;left:30%;background:#fff7ed;padding:12px;display:none}@media(max-width:800px){
 header{padding:13px 14px;gap:10px;align-items:center;flex-wrap:wrap}
 header b{font-size:15px}header>div{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
 header button{padding:8px;font-size:12px}
 main{padding:12px}main h1{font-size:21px;margin:10px 0}
 main>p{font-size:12px;line-height:1.6}
 section{padding:13px;margin:10px 0}
 .filters{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
 .filters>div:last-child{grid-column:1/-1}
 .stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
 .stats section{padding:12px}.stats b{font-size:21px}
 .flex button{flex:1 1 auto;min-height:40px}
 button,input,select,textarea{font-size:16px;min-height:42px}
 .table{overflow-x:auto;-webkit-overflow-scrolling:touch}
 .mask{padding:10px;align-items:flex-end}
 .modal{width:100%;max-height:92dvh;padding:16px;border-radius:14px 14px 0 0}
 .form{grid-template-columns:1fr;gap:11px}.wide{grid-column:1}
 .form textarea{min-height:90px}
 #saveBtn{background:#2563eb;width:100%;font-weight:700;min-height:48px}
 .warn{left:12px;right:12px;bottom:12px;text-align:center}
}</style></head><body>
<header><b>硕丰科技 · 公司流水</b><div><span id="user"></span> <button onclick="location.href='wholemanagement.html'">返回工作台</button> <button onclick="logout()">退出登录</button></div></header><main><h1>公司流水管理</h1><p>独立收支账本，录入后不可修改，只能作废保留历史；暂不自动同步订单和资金余额。</p><section><div class="flex"><button onclick="period('month')">本月</button><button onclick="period('last')">上月</button><button onclick="period('quarter')">本季度</button><button onclick="period('year')">本年</button><button onclick="period('all')">全部</button><button class="blue" onclick="openEntry()">＋ 新增流水</button></div><div class="filters"><div><label>开始</label><input id="from" type="date"></div><div><label>结束</label><input id="to" type="date"></div><div><label>收支</label><select id="direction"><option value="">全部</option><option value="income">收入</option><option value="expense">支出</option></select></div><div><label>状态</label><select id="status"><option value="active">有效</option><option value="all">全部</option><option value="void">已作废</option></select></div><div><label>币种</label><select id="currency"><option>CNY</option><option>EUR</option><option>USD</option><option>HUF</option></select></div><div><label>关键词</label><input id="keyword"></div></div><button class="blue" onclick="loadData()">查询</button> <button onclick="exportCSV()">导出CSV</button><p id="notice">仅统计当前币种，不混合不同币种。</p></section><div class="stats"><section>收入<b id="income" class="green">0</b></section><section>支出<b id="expense" class="red">0</b></section><section>净流入<b id="net">0</b></section><section>有效笔数<b id="count">0</b></section></div><section><h3>分类汇总</h3><div id="categories"></div></section><section><h3>流水明细 <small id="result"></small></h3><div class="table"><table><thead><tr><th>日期</th><th>编号</th><th>收支</th><th>类别</th><th>金额</th><th>币种</th><th>往来单位</th><th>方式</th><th>经办人</th><th>说明</th><th>状态</th><th>录入时间</th><th>操作</th></tr></thead><tbody id="tbody"></tbody></table></div></section></main>
<div class="mask" id="mask"><div class="modal"><h2>录入公司流水</h2><div class="form"><div><label>日期*</label><input id="eDate" type="date"></div><div><label>收支*</label><select id="eDirection" onchange="setCats()"><option value="income">收入</option><option value="expense">支出</option></select></div><div><label>类别*</label><select id="eCategory"></select></div><div><label>金额*</label><input id="eAmount" type="number" min="0.01" step="0.01"></div><div><label>币种</label><select id="eCurrency"><option>CNY</option><option>EUR</option><option>USD</option><option>HUF</option></select></div><div><label>方式</label><select id="eMethod"><option>银行转账</option><option>微信</option><option>支付宝</option><option>现金</option><option>银行卡</option><option>其他</option></select></div><div><label>往来单位</label><input id="eCounterparty"></div><div><label>经办人</label><input id="eHandler"></div><div class="wide"><label>说明*</label><textarea id="eDescription"></textarea></div><div class="wide"><label>备注</label><textarea id="eRemarks"></textarea></div><div class="wide"><button onclick="closeEntry()">取消</button> <button id="saveBtn" class="blue" onclick="saveEntry()">保存</button></div></div></div></div><div class="warn" id="warn">即将自动退出</div>
<script>
const sb=window.supabase.createClient('https://api.shuofengtechnology.com','sb_publishable_PR-D5FTznDtffymRmANXqQ_a5qYXrI4'),$=id=>document.getElementById(id),CATS={income:['客户回款','销售收入','服务收入','其他收入'],expense:['采购付款','服务器/软件','广告推广','办公费用','差旅交通','人员薪酬','房租物业','专业服务','税费','设备采购','其他支出']};let rows=[],shown=[],ok=false,last=Date.now(),leaving=false;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),ds=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),fmt=n=>Number(n||0).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
function period(t){let d=new Date(),y=d.getFullYear(),m=d.getMonth(),a,b;if(t==='all'){$('from').value=$('to').value=''}else{if(t==='month'){a=new Date(y,m,1);b=new Date(y,m+1,0)}else if(t==='last'){a=new Date(y,m-1,1);b=new Date(y,m,0)}else if(t==='quarter'){let q=Math.floor(m/3)*3;a=new Date(y,q,1);b=new Date(y,q+3,0)}else{a=new Date(y,0,1);b=new Date(y,11,31)}$('from').value=ds(a);$('to').value=ds(b)}loadData()}
async function verify(){try{let u=await sb.auth.getUser();if(u.error||!u.data.user)throw Error('未登录');let p=await sb.from('profiles').select('role,is_active,display_name').eq('id',u.data.user.id).single();if(p.error||!p.data?.is_active||!['founder','admin'].includes(p.data.role))throw Error('无权限');ok=true;$('user').textContent=p.data.display_name||'管理人员';document.documentElement.classList.add('ready');period('month')}catch(e){console.error(e);location.replace('page10.html?next=company_transactions.html')}}
async function loadData(){if(!ok)return;try{let q=sb.from('company_transactions').select('*').order('transaction_date',{ascending:false}).order('id',{ascending:false}).limit(5000).eq('currency',$('currency').value);if($('from').value)q=q.gte('transaction_date',$('from').value);if($('to').value)q=q.lte('transaction_date',$('to').value);if($('direction').value)q=q.eq('direction',$('direction').value);if($('status').value!=='all')q=q.eq('status',$('status').value);let r=await q;if(r.error)throw r.error;rows=r.data||[];render()}catch(e){$('notice').textContent='读取失败：'+e.message}}
function render(){let k=$('keyword').value.toLowerCase();shown=rows.filter(x=>!k||[x.transaction_no,x.category,x.counterparty,x.description,x.handler_name].join(' ').toLowerCase().includes(k));let a=shown.filter(x=>x.status==='active'),inc=a.filter(x=>x.direction==='income').reduce((s,x)=>s+Number(x.amount),0),exp=a.filter(x=>x.direction==='expense').reduce((s,x)=>s+Number(x.amount),0);$('income').textContent=fmt(inc);$('expense').textContent=fmt(exp);$('net').textContent=fmt(inc-exp);$('count').textContent=a.length;let cats={};for(let x of a){let k=(x.direction==='income'?'收入·':'支出·')+x.category;cats[k]=(cats[k]||0)+Number(x.amount)}$('categories').innerHTML=Object.entries(cats).map(([k,v])=>'<span style="display:inline-block;margin:8px">'+esc(k)+'：<b>'+fmt(v)+'</b></span>').join('')||'暂无数据';$('result').textContent='共 '+shown.length+' 条';$('tbody').innerHTML=shown.map(x=>'<tr class="'+(x.status==='void'?'void':'')+'"><td>'+esc(x.transaction_date)+'</td><td>'+esc(x.transaction_no)+'</td><td>'+(x.direction==='income'?'收入':'支出')+'</td><td>'+esc(x.category)+'</td><td>'+fmt(x.amount)+'</td><td>'+esc(x.currency)+'</td><td>'+esc(x.counterparty)+'</td><td>'+esc(x.payment_method)+'</td><td>'+esc(x.handler_name)+'</td><td>'+esc(x.description)+'</td><td>'+(x.status==='active'?'有效':'作废')+'</td><td>'+esc(new Date(x.created_at).toLocaleString('zh-CN'))+'</td><td>'+(x.status==='active'?'<button data-id="'+x.id+'" class="voidbtn">作废</button>':esc(x.void_reason))+'</td></tr>').join('')||'<tr><td colspan="13">暂无流水</td></tr>'}
$('tbody').addEventListener('click',e=>{let b=e.target.closest('.voidbtn');if(b)voidEntry(Number(b.dataset.id))});$('keyword').addEventListener('input',render);
function setCats(){$('eCategory').innerHTML=CATS[$('eDirection').value].map(x=>'<option>'+esc(x)+'</option>').join('')}
function openEntry(){$('eDate').value=ds(new Date());$('eCurrency').value=$('currency').value;for(let id of ['eAmount','eCounterparty','eHandler','eDescription','eRemarks'])$(id).value='';setCats();$('mask').classList.add('show')};function closeEntry(){$('mask').classList.remove('show')}
async function saveEntry(){let v=id=>$(id).value.trim(),amount=Number(v('eAmount'));if(!v('eDate')||!Number.isFinite(amount)||amount<=0||!v('eDescription'))return alert('请填写日期、正数金额和说明');$('saveBtn').disabled=true;try{let r=await sb.from('company_transactions').insert({transaction_date:v('eDate'),direction:v('eDirection'),category:v('eCategory'),amount,currency:v('eCurrency'),payment_method:v('eMethod'),counterparty:v('eCounterparty')||null,handler_name:v('eHandler')||null,description:v('eDescription'),remarks:v('eRemarks')||null});if(r.error)throw r.error;closeEntry();await loadData();alert('流水已保存')}catch(e){alert('保存失败：'+e.message)}finally{$('saveBtn').disabled=false}}
async function voidEntry(id){let reason=prompt('请输入作废原因（不能留空）');if(!reason?.trim())return;try{let r=await sb.from('company_transactions').update({status:'void',void_reason:reason.trim()}).eq('id',id).eq('status','active').select('id');if(r.error)throw r.error;if(r.data?.length!==1)throw Error('记录已改变，请刷新');await loadData()}catch(e){alert('作废失败：'+e.message)}}
function exportCSV(){let fields=['transaction_date','transaction_no','direction','category','amount','currency','counterparty','payment_method','handler_name','description','status','created_at','void_reason'];let csv=[fields.join(','),...shown.map(x=>fields.map(k=>'"'+String(x[k]??'').replace(/"/g,'""')+'"').join(','))].join('\r\n');let a=document.createElement('a'),url=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.href=url;a.download='公司流水_'+ds(new Date())+'.csv';a.click();URL.revokeObjectURL(url)}
async function logout(){if(leaving)return;leaving=true;try{await sb.auth.signOut()}catch(e){console.error(e)}location.replace('page10.html')}
for(let event of ['mousedown','mousemove','keydown','scroll','touchstart','click'])document.addEventListener(event,()=>{last=Date.now();$('warn').style.display='none'},true);
setInterval(()=>{let t=Date.now()-last;if(t>=600000)logout();else if(t>=540000)$('warn').style.display='block'},1000);
document.addEventListener('DOMContentLoaded',verify);
</script></body></html>
