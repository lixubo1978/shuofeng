<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>任职档案 · 人员关联查询</title><meta name="description" content="按人员与季度查询任职单位和同期人员，一次创建多条季度记录。"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%231b4357'/%3E%3Cpath d='M12 10v20M20 14h9M20 21h9M20 28h9' stroke='white' stroke-width='3'/%3E%3C/svg%3E"><style>
:root{--navy:#173f54;--ink:#172e3c;--muted:#627784;--line:#dce5eb;--blue:#176782;--surface:#f2f6f9;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--surface);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:disabled,select:disabled{cursor:default;opacity:.55}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #6ab9d3;outline-offset:3px}header{height:78px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 5vw}.brand{display:flex;align-items:center;gap:13px;font-size:19px;font-weight:650}.mark{width:37px;height:37px;background:var(--navy);color:white;border-radius:9px;display:grid;place-items:center}.header-note{font-size:14px;color:var(--muted)}main{max-width:1220px;padding:40px 34px 70px;margin:auto}.eyebrow{font-size:12px;letter-spacing:.16em;color:var(--blue);font-weight:700}.heading{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:27px}h1{font-size:30px;letter-spacing:-.03em;line-height:1.35;margin:6px 0 10px}p{margin:0;color:var(--muted)}.primary{background:var(--navy);border:1px solid var(--navy);color:white;padding:10px 19px;border-radius:7px;white-space:nowrap}.secondary{background:white;border:1px solid var(--line);color:var(--ink);padding:9px 16px;border-radius:7px}.filters{background:white;border:1px solid var(--line);border-radius:12px;padding:27px;display:grid;grid-template-columns:1fr 1fr 1.15fr;gap:26px;box-shadow:0 3px 14px #18364b04}label,.field-label{display:block;font-size:14px;font-weight:600;margin-bottom:9px}label .step{color:#94a6b2;margin-right:9px;font-size:12px}select,input{width:100%;border:1px solid #cddae2;border-radius:6px;padding:11px 12px;color:var(--ink);background:white;min-height:48px}select{padding-right:25px}.unit-box{border-left:1px solid var(--line);padding-left:26px}.unit-value{color:var(--blue);font-size:19px;font-weight:650;padding-top:7px;overflow-wrap:anywhere}.small{font-size:13px;color:var(--muted)}.mode-bar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:21px 2px}.text-button{border:0;background:none;color:var(--blue);font-size:14px;padding:5px}.badge{font-size:12px;border-radius:4px;padding:3px 8px;background:#edf4f7;color:#397084;white-space:nowrap}.panel{border:1px solid var(--line);border-radius:12px;background:white;overflow:hidden}.panel-top{padding:24px 27px;display:flex;align-items:center;justify-content:space-between;gap:20px}.panel-top h2{font-size:18px;margin:0 0 4px}.count{color:var(--blue);font-size:25px;font-weight:650}.count span{font-size:14px;color:var(--muted);font-weight:400;margin-left:5px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left;white-space:nowrap}th{background:#f7f9fb;color:var(--muted);font-size:14px;font-weight:500;padding:13px 27px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}td{padding:20px 27px;border-bottom:1px solid #ecf0f3}tr.selected{background:#f2f8fb}.person-cell{display:flex;align-items:center;gap:12px}.avatar{background:#eaf0f5;color:#476173;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:14px}.selected .avatar{background:var(--navy);color:white}.num{color:#8498a5;font:14px ui-monospace,monospace}.table-footer{padding:16px 27px;color:var(--muted);font-size:13px}.empty{text-align:center;padding:60px 24px}.notice{padding:12px 16px;border:1px solid #c8e0eb;background:#eaf5fa;border-radius:7px;margin-bottom:18px;color:#215875;font-size:14px}.error{background:#fff2f1;color:#9a342a;border-color:#efcac7}.footnote{display:flex;gap:9px;align-items:flex-start;margin:22px 2px;color:var(--muted);font-size:13px}dialog{border:1px solid var(--line);border-radius:14px;padding:28px;max-width:570px;width:calc(100% - 32px);max-height:90vh;overflow:auto;color:var(--ink);box-shadow:0 24px 90px #152f4933}dialog::backdrop{background:#102b4266}dialog h2{margin:0 0 6px;font-size:23px}.dialog-head{display:flex;justify-content:space-between;align-items:start;gap:16px}.close{border:0;background:transparent;font-size:26px;line-height:1;color:var(--muted)}form{margin-top:23px}.form-row{margin-bottom:17px}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.preview{background:#f1f7fa;border:1px solid #d7e6ed;padding:15px;border-radius:7px;font-size:14px;margin:20px 0;color:#375f73}.preview-dates{margin-top:7px;font-size:13px;color:var(--muted);max-height:110px;overflow:auto}.actions{display:flex;justify-content:flex-end;gap:12px}.hidden,[hidden]{display:none!important}@media(max-width:700px){header{padding:0 20px;height:66px}.header-note{display:none}main{padding:27px 16px}.heading{align-items:flex-start}h1{font-size:25px}.heading p{font-size:14px}.filters{grid-template-columns:1fr;padding:20px;gap:18px}.unit-box{border-left:0;border-top:1px solid var(--line);padding:16px 0 0}.panel-top{padding:20px}th,td{padding:15px 19px}.mode-bar{align-items:flex-start}.two{grid-template-columns:1fr}.primary{padding:9px 13px}.panel-top p{font-size:13px}}
</style></head><body>
<header><div class="brand"><span class="mark">档</span>任职档案<span class="small">/ 人员关联查询</span></div><span class="header-note">公开使用 · 无需登录</span></header>
<main><div class="heading"><div><div class="eyebrow">PERSONNEL ARCHIVE</div><h1>人员任职查询</h1><p>选择人员和季度，自动查找同单位的同期人员。</p></div><button id="create" class="primary">＋ 创建记录</button></div>
<div id="notice" class="notice" role="status" hidden></div>
<section class="filters" aria-label="查询条件"><div><label for="person"><span class="step">01</span>人员</label><select id="person" disabled><option>正在加载…</option></select></div><div><label for="quarter"><span class="step">02</span>任职时间</label><select id="quarter" disabled><option>正在加载…</option></select></div><div class="unit-box"><div class="field-label">任职单位 <span class="small">· 自动匹配</span></div><div id="units" class="unit-value">—</div></div></section>
<div class="mode-bar"><span id="mode" class="small">正在连接数据库…</span><button class="text-button" id="toggle">查看虚构示例</button></div>
<section class="panel" aria-busy="true" id="results"><div class="panel-top"><div><h2>同季度 · 同单位人员名单</h2><p id="summary" class="small">请选择查询条件</p></div><div class="count" id="count">0<span>人</span></div></div><div class="table-wrap"><table><thead><tr><th scope="col">序号</th><th scope="col">人员</th><th scope="col">任职时间</th><th scope="col">任职单位</th></tr></thead><tbody id="rows"></tbody></table></div><div id="empty" class="empty">正在加载数据库…</div><div class="table-footer">名单包含所选人员本人；兼任多个单位时，按单位排列。</div></section>
<div class="footnote"><span>ⓘ</span><span>季度记录以季度末为准。一次录入任职区间，自动生成区间内的季度末记录（不含起始日，包含结束日）。</span></div>
</main>
<dialog id="dialog" aria-labelledby="dialog-title"><div class="dialog-head"><div><h2 id="dialog-title">创建任职记录</h2><p class="small">填写一次，自动生成多个季度的记录。</p></div><button class="close" type="button" id="close" aria-label="关闭">×</button></div><form id="form"><div class="form-row"><label for="record-person">人员</label><select id="record-person"><option value="">＋ 新建人员</option></select></div><div id="new-person" class="two"><div class="form-row"><label for="name">姓名</label><input id="name" maxlength="60" required placeholder="输入人员姓名"></div><div class="form-row"><label for="note">区分说明 <span class="small">（选填）</span></label><input id="note" maxlength="100" placeholder="如工号，区分同名人员"></div></div><div class="form-row"><label for="unit">任职单位</label><input id="unit" maxlength="120" required placeholder="输入完整单位名称"></div><div class="two"><div><label for="start">开始日期</label><input id="start" type="date" min="1900-01-01" max="2200-12-31" required value="2005-12-31"></div><div><label for="end">结束日期</label><input id="end" type="date" min="1900-01-01" max="2200-12-31" required value="2006-12-31"></div></div><div class="preview" aria-live="polite"><strong id="preview-count">将生成4条季度记录</strong><div class="preview-dates" id="preview-dates"></div></div><div id="form-error" role="alert" class="notice error" hidden></div><div class="actions"><button id="cancel" type="button" class="secondary">取消</button><button class="primary" id="save" type="submit">创建记录</button></div></form></dialog>
<script type="module">

/* 在下面填写Supabase的Project URL和公开publishable key（也支持旧版anon key）。
   所有访客无需登录即可查询和创建记录。不要填写service_role或secret key。
   保存此文件内容为position_check.html，替换GitHub中的同名页面。
*/
const SUPABASE_URL = '在这里填写Supabase项目URL';
const SUPABASE_PUBLIC_KEY = '在这里填写Supabase公开API_Key';

async function rpc(name,args={}) {
  if(!SUPABASE_URL.startsWith('https://') || SUPABASE_PUBLIC_KEY.startsWith('在这里')) {
    throw Error('请先在HTML中填写SUPABASE_URL和SUPABASE_PUBLIC_KEY。');
  }
  const project=new URL(SUPABASE_URL);
  if(project.protocol!=='https:')throw Error('Supabase项目地址需要使用HTTPS。');
  const headers={apikey:SUPABASE_PUBLIC_KEY,'Content-Type':'application/json'};
  // 旧版anon key是JWT；新版publishable key只放apikey头。
  if(SUPABASE_PUBLIC_KEY.startsWith('eyJ'))headers.Authorization='Bearer '+SUPABASE_PUBLIC_KEY;
  const response=await fetch(project.origin+'/rest/v1/rpc/'+name,{method:'POST',headers,body:JSON.stringify(args)});
  let data;try{data=await response.json()}catch{throw Error('服务器没有返回有效数据，请核对Supabase项目地址。')}
  if(!response.ok)throw Error(data.message||'数据库请求失败，请核对SQL是否执行成功及公开API Key。');
  return data;
}

function quarters(start, end) {
  const valid = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && Number(s.slice(0,4)) >= 1900 && Number(s.slice(0,4)) <= 2200 && !isNaN(Date.parse(s)) && new Date(s+'T00:00:00Z').toISOString().slice(0,10) === s;
  if (!valid(start) || !valid(end) || start >= end) throw new Error('请输入有效的起止日期，结束日期须晚于开始日期（1900—2200年）。');
  const result=[];
  for(let y=Number(start.slice(0,4)); y<=Number(end.slice(0,4)); y++) for(const suffix of ['03-31','06-30','09-30','12-31']) { const day=`${y}-${suffix}`; if(day>start && day<=end) result.push(day); }
  if(!result.length) throw new Error('该区间没有季度末日期，请扩大任职区间。');
  if(result.length>240) throw new Error('单次录入最多支持60年，请分段创建。');
  return result;
}

const $=id=>document.getElementById(id), fmt=d=>`${d.slice(0,4)}年第${Math.ceil(Number(d.slice(5,7))/3)}季度`, esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let options={people:[],quarters:[]},demo=false,seq=0,requestId='',savedOptions=null,lastRows=[],busy=false;
const demoPeople=[{id:'d1',name:'张某',note:'示例人员'},{id:'d2',name:'李某',note:'示例人员'},{id:'d3',name:'王某',note:'示例人员'},{id:'d4',name:'赵某',note:'示例人员'}];
const demoOptions={people:demoPeople,quarters:['2006-12-31','2006-09-30','2006-06-30','2006-03-31']};
const label=p=>`${p.name}${p.note?' · '+p.note:''} [${p.id.slice(0,6)}]`;
function notice(msg,error=false){$('notice').hidden=!msg;$('notice').textContent=msg;$('notice').className='notice'+(error?' error':'');}
async function get(url,init){
  if(url==='/api/options')return rpc('personnel_options');
  if(url==='/api/records')return rpc('personnel_create_record',{p_input:JSON.parse(init.body)});
  const parsed=new URL(url,location.origin);
  if(parsed.pathname==='/api/query')return rpc('personnel_query',{p_person:parsed.searchParams.get('person'),p_quarter:parsed.searchParams.get('quarter')});
  throw Error('未知请求。');
}
function fill(person,quarter){$('person').innerHTML=options.people.length?options.people.map(p=>`<option value="${esc(p.id)}">${esc(label(p))}</option>`).join(''):'<option value="">暂无人员，请创建记录</option>';$('quarter').innerHTML=options.quarters.length?options.quarters.map(q=>`<option value="${q}">${fmt(q)}</option>`).join(''):'<option value="">暂无季度记录</option>';if(options.people.some(p=>p.id===person))$('person').value=person;if(options.quarters.includes(quarter))$('quarter').value=quarter;$('person').disabled=!options.people.length;$('quarter').disabled=!options.quarters.length;$('mode').textContent=demo?'虚构示例 · 仅供体验，不写入数据库':'数据库记录 · 选择条件后自动更新';$('toggle').textContent=demo?'返回数据库':'查看虚构示例';}
function render(rows){lastRows=rows;const units=[...new Set(rows.map(r=>r.unit_name))];$('units').textContent=units.join(' / ')||'无任职记录';$('count').innerHTML=`${new Set(rows.map(r=>r.person_id)).size}<span>人</span>`;$('summary').textContent=$('quarter').value?`${fmt($('quarter').value)} · ${units.length}个单位${demo?' · 虚构示例':''}`:'创建第一条记录，开始查询';$('rows').innerHTML=rows.map((r,i)=>`<tr class="${r.person_id===$('person').value?'selected':''}"><td class="num">${String(i+1).padStart(2,'0')}</td><td><div class="person-cell"><span class="avatar">${esc(r.name[0])}</span><div>${esc(r.name)}${r.person_id===$('person').value?' <span class="badge">所选人员</span>':''}<div class="small">${esc(r.note||'')} · ${esc(r.person_id.slice(0,6))}</div></div></div></td><td>${fmt(r.quarter_end)}</td><td>${esc(r.unit_name)}</td></tr>`).join('');$('empty').hidden=rows.length>0;$('empty').textContent=options.people.length?'该人员在所选季度无任职记录。':'数据库暂无记录。点击“创建记录”开始录入，或查看虚构示例。';$('results').setAttribute('aria-busy','false');}
async function query(){const current=++seq;render([]);if(!$('person').value||!$('quarter').value)return;$('results').setAttribute('aria-busy','true');$('empty').textContent='正在查询…';try{let rows;if(demo){const q=$('quarter').value,p=$('person').value;const records=demoPeople.map((v,i)=>({...v,person_id:v.id,unit_name:i===3?'B单位':(i===0&&q==='2006-12-31'?'B单位':'A单位'),quarter_end:q}));const u=records.find(r=>r.id===p).unit_name;rows=records.filter(r=>r.unit_name===u)}else rows=(await get(`/api/query?person=${encodeURIComponent($('person').value)}&quarter=${$('quarter').value}`)).rows;if(current===seq)render(rows)}catch(e){if(current!==seq)return;render([]);$('empty').textContent=e.message;}}
async function load(person,quarter){try{savedOptions=await get('/api/options');if(!demo){options=savedOptions;fill(person,quarter);await query();}notice('');}catch(e){notice('Supabase尚未连接。核对公开查询的接入配置后点击“重新连接”。',true);$('mode').innerHTML='<button class="text-button" id="retry">重新连接</button>';$('retry').onclick=()=>load();$('person').innerHTML='<option value="">数据库未连接</option>';$('quarter').innerHTML='<option value="">数据库未连接</option>';$('empty').textContent=e.message;$('results').setAttribute('aria-busy','false');}}
$('person').onchange=query;$('quarter').onchange=query;
$('toggle').onclick=async()=>{demo=!demo;notice('');if(demo){options=demoOptions;fill('d1','2006-06-30');await query()}else await load()};
function preview(){try{const dates=quarters($('start').value,$('end').value);$('preview-count').textContent=`将生成 ${dates.length} 条季度记录`;$('preview-dates').textContent=dates.map(fmt).join('、');$('save').disabled=busy;return dates}catch(e){$('preview-count').textContent=e.message;$('preview-dates').textContent='只记录开始日期之后、结束日期以内的季度末。';$('save').disabled=true;return []}}
$('start').onchange=preview;$('end').onchange=preview;
$('record-person').onchange=()=>{const isNew=!$('record-person').value;$('new-person').hidden=!isNew;$('name').required=isNew;};
$('create').onclick=async()=>{$('form-error').hidden=true;requestId=crypto.randomUUID();$('record-person').innerHTML='<option value="">＋ 新建人员</option>'+((savedOptions?.people)||[]).map(p=>`<option value="${esc(p.id)}">${esc(label(p))}</option>`).join('');if(!demo && $('person').value)$('record-person').value=$('person').value;$('record-person').onchange();preview();$('dialog').showModal();};
$('close').onclick=$('cancel').onclick=()=>{if(!busy)$('dialog').close()};$('dialog').addEventListener('cancel',e=>{if(busy)e.preventDefault()});
$('form').addEventListener('input',()=>{if(!busy)requestId=crypto.randomUUID()});
$('form').onsubmit=async e=>{e.preventDefault();if(busy||!preview().length)return;busy=true;$('save').disabled=true;$('save').textContent='正在保存…';$('form-error').hidden=true;const inputs=[...$('form').querySelectorAll('input,select')];inputs.forEach(x=>x.disabled=true);try{const r=await get('/api/records',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({personId:$('record-person').value,name:$('name').value,note:$('note').value,unit:$('unit').value,start:$('start').value,end:$('end').value,requestId})});demo=false;$('dialog').close();$('form').reset();await load(r.personId,r.quarter);notice(`创建成功，已保存 ${r.count} 条季度记录。`);}catch(e){$('form-error').hidden=false;$('form-error').textContent=e.message;}finally{busy=false;inputs.forEach(x=>x.disabled=false);$('save').textContent='创建记录';preview()}};

load();
</script></body></html>
